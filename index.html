    function getLeapMonth(year) {
      return LUNAR_INFO_1900_2100[year - 1900] & 0xf;
    }

    function getLeapDays(year) {
      if (getLeapMonth(year)) {
        return (LUNAR_INFO_1900_2100[year - 1900] & 0x10000) ? 30 : 29;
      }
      return 0;
    }

    function getMonthDays(year, month) {
      return (LUNAR_INFO_1900_2100[year - 1900] & (0x10000 >> month)) ? 30 : 29;
    }

    function getLunarYearDays(year) {
      let sum = 348;
      for (let i = 0x8000; i > 0x8; i >>= 1) {
        sum += (LUNAR_INFO_1900_2100[year - 1900] & i) ? 1 : 0;
      }
      return sum + getLeapDays(year);
    }

    function solarToLunar(sYear, sMonth, sDay) {
      const baseDate = Date.UTC(1900, 0, 31);
      const objDate = Date.UTC(sYear, sMonth - 1, sDay);
      let offset = Math.floor((objDate - baseDate) / 86400000);

      let year = 1900;
      let temp = 0;
      for (year = 1900; year < 2101 && offset > 0; year++) {
        temp = getLunarYearDays(year);
        offset -= temp;
      }
      if (offset < 0) {
        offset += temp;
        year--;
      }

      const leap = getLeapMonth(year);
      let isLeap = false;
      let month = 1;
      for (month = 1; month < 13 && offset > 0; month++) {
        if (leap > 0 && month === (leap + 1) && !isLeap) {
          --month;
          isLeap = true;
          temp = getLeapDays(year);
        } else {
          temp = getMonthDays(year, month);
        }
        if (isLeap && month === (leap + 1)) {
          isLeap = false;
        }
        offset -= temp;
      }

      if (offset === 0 && leap > 0 && month === leap + 1) {
        if (isLeap) {
          isLeap = false;
        } else {
          isLeap = true;
          --month;
        }
      }
      if (offset < 0) {
        offset += temp;
        --month;
      }
      const day = offset + 1;
      return { year, month, day, isLeap };
    }

    function lunarToSolar(lYear, lMonth, lDay, isLeap = false) {
      let offset = 0;
      for (let y = 1900; y < lYear; y++) {
        offset += getLunarYearDays(y);
      }
      const leap = getLeapMonth(lYear);
      for (let m = 1; m < lMonth; m++) {
        offset += getMonthDays(lYear, m);
        if (leap > 0 && m === leap) {
          offset += getLeapDays(lYear);
        }
      }
      if (isLeap && leap === lMonth) {
        offset += getMonthDays(lYear, lMonth);
      }
      offset += lDay - 1;
      const date = new Date(Date.UTC(1900, 0, 31) + offset * 86400000);
      return {
        year: date.getUTCFullYear(),
        month: date.getUTCMonth() + 1,
        day: date.getUTCDate()
      };
    }

    /**
     * 3. THUẬT TOÁN LẬP LÁ SỐ TỬ VI TOÀN DIỆN
     */
    function getSexagenaryIndex(canIdx, chiIdx) {
      for (let i = 0; i < 60; i++) {
        if (i % 10 === canIdx && i % 12 === chiIdx) return i;
      }
      return 0;
    }

    function getJulianDayNumber(y, m, d) {
      const a = Math.floor((14 - m) / 12);
      const y1 = y + 4800 - a;
      const m1 = m + 12 * a - 3;
      return d + Math.floor((153 * m1 + 2) / 5) + 365 * y1 + Math.floor(y1 / 4) - Math.floor(y1 / 100) + Math.floor(y1 / 400) - 32045;
    }

    function calculateTuViChart(input) {
      let sYear = Number(input.year);
      let sMonth = Number(input.month);
      let sDay = Number(input.day);
      let lunarDate;

      if (input.calendarType === 'lunar') {
        lunarDate = { year: sYear, month: sMonth, day: sDay, isLeap: Boolean(input.isLeap) };
        const solar = lunarToSolar(sYear, sMonth, sDay, Boolean(input.isLeap));
        sYear = solar.year;
        sMonth = solar.month;
        sDay = solar.day;
      } else {
        lunarDate = solarToLunar(sYear, sMonth, sDay);
      }

      const hour = Number(input.hour);
      let chiHourIdx = Math.floor(((hour + 1) % 24) / 2);
      let dayOffsetForLateZi = 0;
      if (hour === 23 && input.lateZiRule === 'nextDay') {
        dayOffsetForLateZi = 1;
      }

      const yearCanIdx = MOD(lunarDate.year - 4, 10);
      const yearChiIdx = MOD(lunarDate.year - 4, 12);
      const yearCan = CAN[yearCanIdx];
      const yearChi = CHI[yearChiIdx];

      const monthStartCanIdx = MOD((yearCanIdx % 5) * 2 + 2, 10);
      const monthCanIdx = MOD(monthStartCanIdx + (lunarDate.month - 1), 10);
      const monthChiIdx = MOD(2 + (lunarDate.month - 1), 12);
      const monthCan = CAN[monthCanIdx];
      const monthChi = CHI[monthChiIdx];

      const jdn = getJulianDayNumber(sYear, sMonth, sDay) + dayOffsetForLateZi;
      const dayCanIdx = MOD(jdn + 9, 10);
      const dayChiIdx = MOD(jdn + 1, 12);
      const dayCan = CAN[dayCanIdx];
      const dayChi = CHI[dayChiIdx];

      const hourStartCanIdx = MOD((dayCanIdx % 5) * 2, 10);
      const hourCanIdx = MOD(hourStartCanIdx + chiHourIdx, 10);
      const hourCan = CAN[hourCanIdx];

      const sexagenaryIdx = getSexagenaryIndex(yearCanIdx, yearChiIdx);
      const napAm = NAP_AM_60[sexagenaryIdx];

      const isYangYear = yearCanIdx % 2 === 0;
      const isMale = input.gender === 'Nam';
      const amDuong = `${isYangYear ? 'Dương' : 'Âm'} ${isMale ? 'Nam' : 'Nữ'}`;
      const isThuan = (isYangYear && isMale) || (!isYangYear && !isMale);
      const thuanNghich = isThuan ? 'Âm Dương thuận lý' : 'Âm Dương nghịch lý';

      const effectiveLunarMonth = (lunarDate.isLeap && input.leapMonthRule === 'nextMonth')
        ? (lunarDate.month % 12) + 1
        : lunarDate.month;
      const menhPos = MOD(2 + (effectiveLunarMonth - 1) - chiHourIdx, 12);
      const thanPos = MOD(2 + (effectiveLunarMonth - 1) + chiHourIdx, 12);

      const CUC_START_CAN = [2, 4, 6, 8, 0];
      const menhCanIdx = MOD(CUC_START_CAN[yearCanIdx % 5] + MOD(menhPos - 2, 12), 10);
      const CUC_TABLE = [
        [4, 2, 6, 5, 3],
        [2, 6, 5, 3, 4],
        [6, 5, 3, 4, 2],
        [5, 3, 4, 2, 6],
        [3, 4, 2, 6, 5]
      ];
      const chiPairGroup = Math.floor(MOD(menhPos, 6) / 2);
      const cucNumber = CUC_TABLE[Math.floor(menhCanIdx / 2)][chiPairGroup];
      const CUC_DETAILS = {
        2: { name: 'Thủy Nhị Cục', element: 'Thủy', startAge: 2, trangSinhStart: 8 },
        3: { name: 'Mộc Tam Cục', element: 'Mộc', startAge: 3, trangSinhStart: 11 },
        4: { name: 'Kim Tứ Cục', element: 'Kim', startAge: 4, trangSinhStart: 5 },
        5: { name: 'Thổ Ngũ Cục', element: 'Thổ', startAge: 5, trangSinhStart: 8 },
        6: { name: 'Hỏa Lục Cục', element: 'Hỏa', startAge: 6, trangSinhStart: 2 }
      };
      const cucInfo = CUC_DETAILS[cucNumber];

      const ELEMENT_GEN = { Kim: 'Thủy', Thủy: 'Mộc', Mộc: 'Hỏa', Hỏa: 'Thổ', Thổ: 'Kim' };
      const ELEMENT_OVERCOME = { Kim: 'Mộc', Mộc: 'Thổ', Thổ: 'Thủy', Thủy: 'Hỏa', Hỏa: 'Kim' };
      let menhCucRelation = 'Mệnh Cục bình hòa';
      if (napAm.element === cucInfo.element) menhCucRelation = 'Mệnh Cục đồng hành';
      else if (ELEMENT_GEN[cucInfo.element] === napAm.element) menhCucRelation = 'Cục sinh Bản Mệnh';
      else if (ELEMENT_GEN[napAm.element] === cucInfo.element) menhCucRelation = 'Bản Mệnh sinh Cục';
      else if (ELEMENT_OVERCOME[cucInfo.element] === napAm.element) menhCucRelation = 'Cục khắc Bản Mệnh';
      else if (ELEMENT_OVERCOME[napAm.element] === cucInfo.element) menhCucRelation = 'Bản Mệnh khắc Cục';

      const MENH_CHU_BY_CHI = ['Tham Lang', 'Cự Môn', 'Lộc Tồn', 'Văn Khúc', 'Liêm Trinh', 'Vũ Khúc', 'Phá Quân', 'Vũ Khúc', 'Liêm Trinh', 'Văn Khúc', 'Lộc Tồn', 'Cự Môn'];
      const THAN_CHU_BY_CHI = ['Linh Tinh', 'Thiên Tướng', 'Thiên Lương', 'Thiên Đồng', 'Văn Xương', 'Thiên Cơ', 'Hỏa Tinh', 'Thiên Tướng', 'Thiên Lương', 'Thiên Đồng', 'Văn Xương', 'Thiên Cơ'];
      const menhChu = MENH_CHU_BY_CHI[menhPos];
      const thanChu = THAN_CHU_BY_CHI[yearChiIdx];

      const PALACE_NAMES = ['MỆNH', 'PHỤ MẪU', 'PHÚC ĐỨC', 'ĐIỀN TRẠCH', 'QUAN LỘC', 'NÔ BỘC', 'THIÊN DI', 'TẬT ÁCH', 'TÀI BẠCH', 'TỬ TỨC', 'PHU THÊ', 'HUYNH ĐỆ'];
      const TRANG_SINH_NAMES = ['Tràng Sinh', 'Mộc Dục', 'Quan Đới', 'Lâm Quan', 'Đế Vượng', 'Suy', 'Bệnh', 'Tử', 'Mộ', 'Tuyệt', 'Thai', 'Dưỡng'];

      const palaces = Array.from({ length: 12 }, (_, chiIdx) => {
        const palaceOffset = MOD(chiIdx - menhPos, 12);
        const palaceCanIdx = MOD(CUC_START_CAN[yearCanIdx % 5] + MOD(chiIdx - 2, 12), 10);
        const daiHanStep = isThuan ? palaceOffset : MOD(menhPos - chiIdx, 12);
        const daiHanStart = cucInfo.startAge + daiHanStep * 10;
        const trangSinhOffset = isThuan
          ? MOD(chiIdx - cucInfo.trangSinhStart, 12)
          : MOD(cucInfo.trangSinhStart - chiIdx, 12);

        return {
          chiIdx,
          chiName: CHI[chiIdx],
          canName: CAN[palaceCanIdx],
          canChiLabel: `${CAN[palaceCanIdx][0]}.${CHI[chiIdx]}`,
          name: PALACE_NAMES[palaceOffset],
          isMenh: chiIdx === menhPos,
          isThan: chiIdx === thanPos,
          daiHanStart,
          daiHanEnd: daiHanStart + 9,
          trangSinh: TRANG_SINH_NAMES[trangSinhOffset],
          chinhTinh: [],
          phuTinh: [],
          hasTuan: false,
          hasTriet: false
        };
      });

      const thanCuPalaceName = palaces[thanPos].name;

      // An 14 Chính Tinh
      const day = lunarDate.day;
      let tuViPos = 0;
      if (day % cucNumber === 0) {
        tuViPos = MOD(2 + (day / cucNumber) - 1, 12);
      } else {
        const q = Math.floor(day / cucNumber) + 1;
        const diff = q * cucNumber - day;
        const base = 2 + q - 1;
        tuViPos = diff % 2 === 1 ? MOD(base - diff, 12) : MOD(base + diff, 12);
      }
      const thienPhuPos = MOD(4 - tuViPos, 12);

      const CHINH_TINH_POS = {
        'Tử Vi': tuViPos,
        'Thiên Cơ': MOD(tuViPos - 1, 12),
        'Thái Dương': MOD(tuViPos - 3, 12),
        'Vũ Khúc': MOD(tuViPos - 4, 12),
        'Thiên Đồng': MOD(tuViPos - 5, 12),
        'Liêm Trinh': MOD(tuViPos - 8, 12),
        'Thiên Phủ': thienPhuPos,
        'Thái Âm': MOD(thienPhuPos + 1, 12),
        'Tham Lang': MOD(thienPhuPos + 2, 12),
        'Cự Môn': MOD(thienPhuPos + 3, 12),
        'Thiên Tướng': MOD(thienPhuPos + 4, 12),
        'Thiên Lương': MOD(thienPhuPos + 5, 12),
        'Thất Sát': MOD(thienPhuPos + 6, 12),
        'Phá Quân': MOD(thienPhuPos + 10, 12)
      };

      const TU_HOA_BY_CAN = [
        ['Liêm Trinh', 'Phá Quân', 'Vũ Khúc', 'Thái Dương'],
        ['Thiên Cơ', 'Thiên Lương', 'Tử Vi', 'Thái Âm'],
        ['Thiên Đồng', 'Thiên Cơ', 'Văn Xương', 'Liêm Trinh'],
        ['Thái Âm', 'Thiên Đồng', 'Thiên Cơ', 'Cự Môn'],
        ['Tham Lang', 'Thái Âm', 'Hữu Bật', 'Thiên Cơ'],
        ['Vũ Khúc', 'Tham Lang', 'Thiên Lương', 'Văn Khúc'],
        ['Thái Dương', 'Vũ Khúc', 'Thái Âm', 'Thiên Đồng'],
        ['Cự Môn', 'Thái Dương', 'Văn Khúc', 'Văn Xương'],
        ['Thiên Lương', 'Tử Vi', 'Tả Phù', 'Vũ Khúc'],
        ['Phá Quân', 'Cự Môn', 'Thái Âm', 'Tham Lang']
      ];
      const hoaStars = TU_HOA_BY_CAN[yearCanIdx];
      const HOA_LABELS = ['Hóa Lộc', 'Hóa Quyền', 'Hóa Khoa', 'Hóa Kỵ'];
      const tuHoaList = [];

      Object.entries(CHINH_TINH_POS).forEach(([starName, pos]) => {
        const info = CHINH_TINH_DATA[starName];
        const hoaIdx = hoaStars.indexOf(starName);
        const tuHoa = hoaIdx !== -1 ? HOA_LABELS[hoaIdx] : null;
        if (tuHoa) {
          tuHoaList.push({ hoa: tuHoa, star: starName, palace: palaces[pos].name, chiName: CHI[pos] });
        }
        palaces[pos].chinhTinh.push({
          name: starName,
          element: info.element,
          brightness: info.brightness[pos],
          tuHoa
        });
      });

      const addPhuTinh = (name, pos) => {
        const pIdx = MOD(pos, 12);
        const meta = PHU_TINH_DATA[name] || { element: 'Thổ', type: 'cat' };
        const brightness = meta.brightness ? meta.brightness[pIdx] : null;
        palaces[pIdx].phuTinh.push({
          name,
          element: meta.element,
          type: meta.type,
          brightness
        });
        const hoaIdx = hoaStars.indexOf(name);
        if (hoaIdx !== -1) {
          const tuHoa = HOA_LABELS[hoaIdx];
          palaces[pIdx].phuTinh.push({
            name: tuHoa,
            element: tuHoa === 'Hóa Kỵ' ? 'Thủy' : 'Mộc',
            type: tuHoa === 'Hóa Kỵ' ? 'sat' : 'cat'
          });
          tuHoaList.push({ hoa: tuHoa, star: name, palace: palaces[pIdx].name, chiName: CHI[pIdx] });
        }
      };

      const THAI_TUE_RING = [
        'Thái Tuế', 'Thiếu Dương', 'Tang Môn', 'Thiếu Âm', 'Quan Phù', 'Tử Phù',
        'Tuế Phá', 'Long Đức', 'Bạch Hổ', 'Phúc Đức', 'Điếu Khách', 'Trực Phù'
      ];
      THAI_TUE_RING.forEach((star, i) => addPhuTinh(star, yearChiIdx + i));

      const LOC_TON_POS = [2, 3, 5, 6, 5, 6, 8, 9, 11, 0];
      const locTonPos = LOC_TON_POS[yearCanIdx];
      addPhuTinh('Lộc Tồn', locTonPos);
      addPhuTinh('Kình Dương', locTonPos + 1);
      addPhuTinh('Đà La', locTonPos - 1);

      const BAC_SI_RING = [
        'Bác Sĩ', 'Lực Sĩ', 'Thanh Long', 'Tiểu Hao', 'Tướng Quân', 'Tấu Thư',
        'Phi Liêm', 'Hỷ Thần', 'Bệnh Phù', 'Đại Hao', 'Phục Binh', 'Quan Phủ'
      ];
      BAC_SI_RING.forEach((star, i) => {
        addPhuTinh(star, isThuan ? locTonPos + i : locTonPos - i);
      });

      const taPhuPos = MOD(4 + (effectiveLunarMonth - 1), 12);
      const huuBatPos = MOD(10 - (effectiveLunarMonth - 1), 12);
      const vanXuongPos = MOD(10 - chiHourIdx, 12);
      const vanKhucPos = MOD(4 + chiHourIdx, 12);
      addPhuTinh('Tả Phù', taPhuPos);
      addPhuTinh('Hữu Bật', huuBatPos);
      addPhuTinh('Văn Xương', vanXuongPos);
      addPhuTinh('Văn Khúc', vanKhucPos);

      addPhuTinh('Ân Quang', vanXuongPos + lunarDate.day - 2);
      addPhuTinh('Thiên Quý', vanKhucPos - lunarDate.day + 2);
      addPhuTinh('Tam Thai', taPhuPos + lunarDate.day - 1);
      addPhuTinh('Bát Tọa', huuBatPos - lunarDate.day + 1);
      addPhuTinh('Thai Phụ', vanKhucPos + 2);
      addPhuTinh('Phong Cáo', vanKhucPos - 2);

      const KHOI_VIET_MAP = [
        [1, 7], [0, 8], [11, 9], [11, 9], [1, 7],
        [0, 8], [1, 7], [6, 2], [3, 5], [3, 5]
      ];
      addPhuTinh('Thiên Khôi', KHOI_VIET_MAP[yearCanIdx][0]);
      addPhuTinh('Thiên Việt', KHOI_VIET_MAP[yearCanIdx][1]);

      const QUAN_PHUC_MAP = [
        [7, 9], [4, 8], [5, 0], [2, 11], [3, 3],
        [9, 2], [11, 6], [9, 5], [10, 6], [6, 5]
      ];
      addPhuTinh('Thiên Quan', QUAN_PHUC_MAP[yearCanIdx][0]);
      addPhuTinh('Thiên Phúc', QUAN_PHUC_MAP[yearCanIdx][1]);

      const VAN_TINH_MAP = [5, 6, 8, 9, 8, 9, 11, 0, 2, 3];
      const LUU_HA_MAP = [9, 10, 7, 8, 5, 6, 3, 4, 11, 2];
      const THIEN_TRU_MAP = [5, 6, 0, 5, 6, 8, 2, 6, 9, 10];
      addPhuTinh('Văn Tinh', VAN_TINH_MAP[yearCanIdx]);
      addPhuTinh('Đường Phù', locTonPos + 5);
      addPhuTinh('Quốc Ấn', locTonPos + 8);
      addPhuTinh('Thiên Trù', THIEN_TRU_MAP[yearCanIdx]);
      addPhuTinh('Lưu Hà', LUU_HA_MAP[yearCanIdx]);

      addPhuTinh('Long Trì', 4 + yearChiIdx);
      addPhuTinh('Phượng Các', 10 - yearChiIdx);
      addPhuTinh('Giải Thần', 10 - yearChiIdx);
      addPhuTinh('Thiên Khốc', 6 - yearChiIdx);
      addPhuTinh('Thiên Hư', 6 + yearChiIdx);
      addPhuTinh('Thiên Đức', 9 + yearChiIdx);
      addPhuTinh('Nguyệt Đức', 5 + yearChiIdx);
      addPhuTinh('Hồng Loan', 3 - yearChiIdx);
      addPhuTinh('Thiên Hỷ', 9 - yearChiIdx);

      addPhuTinh('Thiên Hình', 9 + (effectiveLunarMonth - 1));
      addPhuTinh('Thiên Riêu', 1 + (effectiveLunarMonth - 1));
      addPhuTinh('Thiên Y', 1 + (effectiveLunarMonth - 1));
      addPhuTinh('Thiên Giải', 8 + (effectiveLunarMonth - 1));
      addPhuTinh('Địa Giải', 7 + (effectiveLunarMonth - 1));

      const TAM_HOP_STARS = {
        2: { ma: 8, dao: 3, cai: 10, kiep: 11 }, 6: { ma: 8, dao: 3, cai: 10, kiep: 11 }, 10: { ma: 8, dao: 3, cai: 10, kiep: 11 },
        8: { ma: 2, dao: 9, cai: 4, kiep: 5 }, 0: { ma: 2, dao: 9, cai: 4, kiep: 5 }, 4: { ma: 2, dao: 9, cai: 4, kiep: 5 },
        5: { ma: 11, dao: 6, cai: 1, kiep: 2 }, 9: { ma: 11, dao: 6, cai: 1, kiep: 2 }, 1: { ma: 11, dao: 6, cai: 1, kiep: 2 },
        11: { ma: 5, dao: 0, cai: 7, kiep: 8 }, 3: { ma: 5, dao: 0, cai: 7, kiep: 8 }, 7: { ma: 5, dao: 0, cai: 7, kiep: 8 }
      };
      const thStars = TAM_HOP_STARS[yearChiIdx];
      addPhuTinh('Thiên Mã', thStars.ma);
      addPhuTinh('Đào Hoa', thStars.dao);
      addPhuTinh('Hoa Cái', thStars.cai);
      addPhuTinh('Kiếp Sát', thStars.kiep);

      addPhuTinh('Địa Không', 11 - chiHourIdx);
      addPhuTinh('Địa Kiếp', 11 + chiHourIdx);
      const HOA_LINH_START = {
        2: [1, 3], 6: [1, 3], 10: [1, 3],
        8: [2, 10], 0: [2, 10], 4: [2, 10],
        5: [3, 10], 9: [3, 10], 1: [3, 10],
        11: [9, 10], 3: [9, 10], 7: [9, 10]
      };
      const [hoaStart, linhStart] = HOA_LINH_START[yearChiIdx];
      addPhuTinh('Hỏa Tinh', hoaStart + chiHourIdx);
      addPhuTinh('Linh Tinh', linhStart + chiHourIdx);

      const CO_QUA_MAP = [
        [2, 10], [2, 10], [5, 1], [5, 1], [5, 1], [8, 4],
        [8, 4], [8, 4], [11, 7], [11, 7], [11, 7], [2, 10]
      ];
      addPhuTinh('Cô Thần', CO_QUA_MAP[yearChiIdx][0]);
      addPhuTinh('Quả Tú', CO_QUA_MAP[yearChiIdx][1]);
      const PHA_TOAI_MAP = [5, 1, 9, 5, 1, 9, 5, 1, 9, 5, 1, 9];
      addPhuTinh('Phá Toái', PHA_TOAI_MAP[yearChiIdx]);
      addPhuTinh('Thiên La', 4);
      addPhuTinh('Địa Võng', 10);
      addPhuTinh('Thiên Thương', menhPos + 5);
      addPhuTinh('Thiên Sứ', menhPos + 7);
      addPhuTinh('Thiên Tài', menhPos + yearChiIdx);
      addPhuTinh('Thiên Thọ', thanPos + yearChiIdx);
      addPhuTinh('Đẩu Quân', yearChiIdx - (lunarDate.month - 1) + chiHourIdx);

      const giapChiOfWeek = MOD(yearChiIdx - yearCanIdx, 12);
      const tuanPair = [MOD(giapChiOfWeek - 2, 12), MOD(giapChiOfWeek - 1, 12)];
      const TRIET_MAP = [
        [8, 9], [6, 7], [4, 5], [2, 3], [0, 1],
        [8, 9], [6, 7], [4, 5], [2, 3], [0, 1]
      ];
      const trietPair = TRIET_MAP[yearCanIdx];
      for (let i = 0; i < 12; i++) {
        palaces[i].hasTuan = tuanPair.includes(i);
        palaces[i].hasTriet = trietPair.includes(i);
      }

      return {
        input,
        solarDate: { year: sYear, month: sMonth, day: sDay },
        lunarDate,
        canChi: {
          yearCan, yearChi, yearCanIdx, yearChiIdx,
          monthCan, monthChi, dayCan, dayChi,
          hourCan, hourChi: CHI[chiHourIdx], chiHourIdx
        },
        banMenh: {
          napAm, amDuong, thuanNghich, cucInfo, menhCucRelation,
          menhPos, thanPos, thanCuPalaceName, menhChu, thanChu
        },
        palaces,
        tuHoaList
      };
    }

    /**
     * 4. TÍNH TIỂU HẠN, LƯU NIÊN (L.) & SAO ĐẠI VẬN (ĐV.)
     */
    function calculateAnnualFortune(chart, targetYear) {
      const lunarAge = targetYear - chart.lunarDate.year + 1;
      const targetCanIdx = MOD(targetYear - 4, 10);
      const targetChiIdx = MOD(targetYear - 4, 12);
      const targetCan = CAN[targetCanIdx];
      const targetChi = CHI[targetChiIdx];

      const TIEU_HAN_START = {
        2: 4, 6: 4, 10: 4,
        8: 10, 0: 10, 4: 10,
        5: 7, 9: 7, 1: 7,
        11: 1, 3: 1, 7: 1
      };
      const startChi = TIEU_HAN_START[chart.canChi.yearChiIdx];
      const isMale = chart.input.gender === 'Nam';
      const step = MOD(targetChiIdx - chart.canChi.yearChiIdx, 12);
      const tieuHanPos = isMale ? MOD(startChi + step, 12) : MOD(startChi - step, 12);

      const activeDaiHan = chart.palaces.find(
        p => lunarAge >= p.daiHanStart && lunarAge <= p.daiHanEnd
      ) || chart.palaces[chart.banMenh.menhPos];

      const TU_HOA_BY_CAN = [
        ['Liêm Trinh', 'Phá Quân', 'Vũ Khúc', 'Thái Dương'],
        ['Thiên Cơ', 'Thiên Lương', 'Tử Vi', 'Thái Âm'],
        ['Thiên Đồng', 'Thiên Cơ', 'Văn Xương', 'Liêm Trinh'],
        ['Thái Âm', 'Thiên Đồng', 'Thiên Cơ', 'Cự Môn'],
        ['Tham Lang', 'Thái Âm', 'Hữu Bật', 'Thiên Cơ'],
        ['Vũ Khúc', 'Tham Lang', 'Thiên Lương', 'Văn Khúc'],
        ['Thái Dương', 'Vũ Khúc', 'Thái Âm', 'Thiên Đồng'],
        ['Cự Môn', 'Thái Dương', 'Văn Khúc', 'Văn Xương'],
        ['Thiên Lương', 'Tử Vi', 'Tả Phù', 'Vũ Khúc'],
        ['Phá Quân', 'Cự Môn', 'Thái Âm', 'Tham Lang']
      ];
      const LOC_TON_POS = [2, 3, 5, 6, 5, 6, 8, 9, 11, 0];
      const KHOI_VIET_MAP = [
        [1, 7], [0, 8], [11, 9], [11, 9], [1, 7],
        [0, 8], [1, 7], [6, 2], [3, 5], [3, 5]
      ];
      const TAM_HOP_MA_DAO = {
        2: { ma: 8, dao: 3 }, 6: { ma: 8, dao: 3 }, 10: { ma: 8, dao: 3 },
        8: { ma: 2, dao: 9 }, 0: { ma: 2, dao: 9 }, 4: { ma: 2, dao: 9 },
        5: { ma: 11, dao: 6 }, 9: { ma: 11, dao: 6 }, 1: { ma: 11, dao: 6 },
        11: { ma: 5, dao: 0 }, 3: { ma: 5, dao: 0 }, 7: { ma: 5, dao: 0 }
      };

      const luuStarsByPalace = Array.from({ length: 12 }, () => []);
      const dvStarsByPalace = Array.from({ length: 12 }, () => []);

      const addLuuStar = (pos, name, element, isCat) => {
        luuStarsByPalace[MOD(pos, 12)].push({ name, element, isCat });
      };
      addLuuStar(targetChiIdx, 'L. Thái Tuế', 'Hỏa', false);
      addLuuStar(targetChiIdx + 2, 'L. Tang Môn', 'Mộc', false);
      addLuuStar(targetChiIdx + 8, 'L. Bạch Hổ', 'Kim', false);
      addLuuStar(6 - targetChiIdx, 'L. Thiên Khốc', 'Kim', false);
      addLuuStar(6 + targetChiIdx, 'L. Thiên Hư', 'Thủy', false);
      const luuLocPos = LOC_TON_POS[targetCanIdx];
      addLuuStar(luuLocPos, 'L. Lộc Tồn', 'Thổ', true);
      addLuuStar(luuLocPos + 1, 'L. Kình Dương', 'Kim', false);
      addLuuStar(luuLocPos - 1, 'L. Đà La', 'Kim', false);
      addLuuStar(KHOI_VIET_MAP[targetCanIdx][0], 'L. Thiên Khôi', 'Hỏa', true);
      addLuuStar(KHOI_VIET_MAP[targetCanIdx][1], 'L. Thiên Việt', 'Hỏa', true);
      addLuuStar(TAM_HOP_MA_DAO[targetChiIdx].ma, 'L. Thiên Mã', 'Hỏa', true);
      addLuuStar(TAM_HOP_MA_DAO[targetChiIdx].dao, 'L. Đào Hoa', 'Mộc', true);
      addLuuStar(3 - targetChiIdx, 'L. Hồng Loan', 'Thủy', true);

      const luuHoaNames = TU_HOA_BY_CAN[targetCanIdx];
      const HOA_SHORT = ['L. Hóa Lộc', 'L. Hóa Quyền', 'L. Hóa Khoa', 'L. Hóa Kỵ'];
      const luuTuHoa = luuHoaNames.map((starName, idx) => {
        const foundPalace = chart.palaces.find(
          p => p.chinhTinh.some(s => s.name === starName) || p.phuTinh.some(s => s.name === starName)
        );
        const pIdx = foundPalace ? foundPalace.chiIdx : 0;
        addLuuStar(pIdx, HOA_SHORT[idx], idx === 3 ? 'Thủy' : 'Mộc', idx !== 3);
        return {
          hoa: ['Lưu Hóa Lộc', 'Lưu Hóa Quyền', 'Lưu Hóa Khoa', 'Lưu Hóa Kỵ'][idx],
          star: starName,
          palace: foundPalace ? foundPalace.name : 'MỆNH',
          chiName: foundPalace ? foundPalace.chiName : 'Tý'
        };
      });

      const dvCanIdx = CAN.indexOf(activeDaiHan.canName);
      const addDvStar = (pos, name, element, isCat) => {
        dvStarsByPalace[MOD(pos, 12)].push({ name, element, isCat });
      };
      const dvLocPos = LOC_TON_POS[dvCanIdx];
      addDvStar(dvLocPos, 'ĐV. Lộc Tồn', 'Thổ', true);
      addDvStar(dvLocPos + 1, 'ĐV. K Dương', 'Kim', false);
      addDvStar(dvLocPos - 1, 'ĐV. Đà La', 'Kim', false);
      addDvStar(KHOI_VIET_MAP[dvCanIdx][0], 'ĐV. T Khôi', 'Hỏa', true);
      addDvStar(KHOI_VIET_MAP[dvCanIdx][1], 'ĐV. T Việt', 'Hỏa', true);
      addDvStar(TAM_HOP_MA_DAO[activeDaiHan.chiIdx].ma, 'ĐV. T Mã', 'Hỏa', true);

      const dvHoaNames = TU_HOA_BY_CAN[dvCanIdx];
      const DV_HOA_SHORT = ['ĐV. H Lộc', 'ĐV. H Quyền', 'ĐV. H Khoa', 'ĐV. H Kỵ'];
      dvHoaNames.forEach((starName, idx) => {
        const foundPalace = chart.palaces.find(
          p => p.chinhTinh.some(s => s.name === starName) || p.phuTinh.some(s => s.name === starName)
        );
        if (foundPalace) {
          addDvStar(foundPalace.chiIdx, DV_HOA_SHORT[idx], idx === 3 ? 'Thủy' : 'Mộc', idx !== 3);
        }
      });

      const tieuHanChiByPalace = Array.from({ length: 12 }, (_, chiIdx) => {
        const offset = isMale ? MOD(chiIdx - tieuHanPos, 12) : MOD(tieuHanPos - chiIdx, 12);
        return CHI[MOD(targetChiIdx + offset, 12)];
      });

      const month1Pos = MOD(tieuHanPos - (chart.lunarDate.month - 1) + chart.canChi.chiHourIdx, 12);
      const monthLabelsByPalace = Array.from({ length: 12 }, (_, chiIdx) => {
        const m = MOD(chiIdx - month1Pos, 12) + 1;
        return `T.${m}`;
      });

      return {
        targetYear, lunarAge, canChi: `${targetCan} ${targetChi}`,
        tieuHanPalace: chart.palaces[tieuHanPos],
        luuNienPalace: chart.palaces[targetChiIdx],
        activeDaiHan, luuTuHoa, luuStarsByPalace, dvStarsByPalace,
        tieuHanChiByPalace, monthLabelsByPalace
      };
    }

    /**
     * 5. TAM PHƯƠNG TỨ CHÍNH & AI INTERPRETATION ENGINE
     */
    function getTamPhuongTuChinh(chart, chiIdx) {
      const tamHop1 = MOD(chiIdx + 4, 12);
      const tamHop2 = MOD(chiIdx + 8, 12);
      const xungChieu = MOD(chiIdx + 6, 12);
      return {
        chinhCung: chart.palaces[chiIdx],
        tamHop1: chart.palaces[tamHop1],
        tamHop2: chart.palaces[tamHop2],
        xungChieu: chart.palaces[xungChieu],
        indices: [chiIdx, tamHop1, tamHop2, xungChieu]
      };
    }

    function generatePalaceAnalysis(chart, chiIdx) {
      const tptc = getTamPhuongTuChinh(chart, chiIdx);
      const palace = tptc.chinhCung;
      const meta = PALACE_DESCRIPTIONS[palace.name];

      const isVCD = palace.chinhTinh.length === 0;
      const effectiveMainStars = isVCD ? tptc.xungChieu.chinhTinh : palace.chinhTinh;
      const catStars = palace.phuTinh.filter(s => s.type === 'cat');
      const satStars = palace.phuTinh.filter(s => s.type === 'sat');

      const relatedChinhTinh = [
        ...tptc.tamHop1.chinhTinh.map(s => `${s.name} (${s.brightness}) tại ${tptc.tamHop1.name}`),
        ...tptc.tamHop2.chinhTinh.map(s => `${s.name} (${s.brightness}) tại ${tptc.tamHop2.name}`),
        ...tptc.xungChieu.chinhTinh.map(s => `${s.name} (${s.brightness}) tại ${tptc.xungChieu.name}`)
      ];

      const allFourIndices = tptc.indices;
      const relatedTuHoa = chart.tuHoaList.filter(th => {
        const p = chart.palaces.find(item => item.name === th.palace);
        return p && allFourIndices.includes(p.chiIdx);
      });

      let score = 0;
      effectiveMainStars.forEach(s => {
        if (s.brightness === 'M' || s.brightness === 'V') score += 2;
        else if (s.brightness === 'Đ') score += 1;
        else if (s.brightness === 'H') score -= 1;
      });
      score += Math.min(catStars.length * 0.4, 2.5);
      score -= Math.min(satStars.length * 0.4, 2.5);
      relatedTuHoa.forEach(th => {
        if (th.hoa === 'Hóa Kỵ') score -= 1;
        else score += 1;
      });

      let rating = 'Bình ổn';
      if (score >= 2) rating = 'Thuận';
      else if (score <= -1.2) rating = 'Cần giữ';

      const mainStarIntro = isVCD
        ? `Cung ${palace.name} tại ${palace.chiName} ở thế Vô Chính Diệu (không có chính tinh tọa thủ), nên mượn bộ chính tinh ${effectiveMainStars.map(s => `${s.name} (${s.brightness})`).join(' và ')} từ cung xung chiếu ${tptc.xungChieu.name} (${tptc.xungChieu.chiName}) làm nòng cốt định hướng.`
        : `Cung ${palace.name} tại ${palace.chiName} có ${palace.chinhTinh.map(s => `${s.name} (${s.brightness === 'M' ? 'Miếu' : s.brightness === 'V' ? 'Vượng' : s.brightness === 'Đ' ? 'Đắc' : s.brightness === 'B' ? 'Bình' : 'Hãm'})`).join(' đồng cung ')} tọa thủ.`;

      const auxIntro = catStars.length > 0
        ? `Về trợ lực, cung hội tụ các cát tinh như ${catStars.slice(0, 6).map(s => s.name).join(', ')}, giúp tăng cường sự hanh thông và khả năng thích ứng.`
        : `Về phụ tinh, cung không có nhiều cát tinh trực chiếu nên cần nương tựa thêm vào bộ sao từ tam hợp chiếu về.`;

      const satIntro = satStars.length > 0
        ? `Đồng thời có sự hiện diện của ${satStars.slice(0, 5).map(s => s.name).join(', ')}, tạo nên áp lực rèn luyện hoặc đòi hỏi sự cẩn trọng trong hành động.`
        : `Cung ít chịu tác động trực tiếp của sát tinh nặng, giữ được sự ổn định tương đối.`;

      const tptcIntro = `Xét trên toàn cục Tam Phương Tứ Chính (${palace.name} – ${tptc.tamHop1.name} – ${tptc.tamHop2.name} – ${tptc.xungChieu.name}), cung nhận được sự hội chiếu của ${relatedChinhTinh.length > 0 ? relatedChinhTinh.join('; ') : 'các cung Vô Chính Diệu đồng thanh tương ứng'}. ${relatedTuHoa.length > 0 ? `Đáng chú ý trong tam phương tứ chính có ${relatedTuHoa.map(th => `${th.hoa} đi cùng ${th.star} tại ${th.palace}`).join(', ')}.` : ''}`;

      return {
        palace, tptc, meta, isVCD, effectiveMainStars, catStars, satStars, relatedTuHoa, rating,
        sections: {
          overview: meta.focus,
          mainStarsText: mainStarIntro,
          auxStarsText: `${auxIntro} ${satIntro}`,
          tptcText: tptcIntro,
          strengths: effectiveMainStars.map(s => CHINH_TINH_DATA[s.name]?.favorable).filter(Boolean).join(' '),
          cautions: effectiveMainStars.map(s => CHINH_TINH_DATA[s.name]?.caution).filter(Boolean).join(' ')
        }
      };
    }

                      <h3 className="font-bold text-[#244C43] mb-1.5">1. Tổng quan & Công việc</h3>
                      <p>
                        Năm {annualFortune.canChi}, Tiểu hạn vận hành tại cung <strong>{annualFortune.tieuHanPalace.name}</strong> ({annualFortune.tieuHanPalace.chiName}) trong bối cảnh Đại hạn <strong>{annualFortune.activeDaiHan.name}</strong>. Các quyết định nghề nghiệp nên bám sát trục tam hợp của cung Tiểu hạn để tối ưu nguồn lực.
                      </p>
                    </div>
                    <div className="p-4 rounded-2xl bg-[#F3F0E5] border border-[#D8CFC0]">
                      <h3 className="font-bold text-[#244C43] mb-1.5">2. Tài chính & Quan hệ</h3>
                      <p>
                        Lưu Hóa Lộc kích hoạt sao <strong>{annualFortune.luuTuHoa[0].star}</strong> tại cung <strong>{annualFortune.luuTuHoa[0].palace}</strong> mở ra cơ hội tăng trưởng, trong khi Lưu Hóa Kỵ đi cùng <strong>{annualFortune.luuTuHoa[3].star}</strong> tại <strong>{annualFortune.luuTuHoa[3].palace}</strong> nhắc nhở cần minh bạch giấy tờ và giao tiếp.
                      </p>
                    </div>
                    <div className="p-4 rounded-2xl bg-[#F3F0E5] border border-[#D8CFC0]">
                      <h3 className="font-bold text-[#244C43] mb-1.5">3. Sức khỏe & Chủ động chuẩn bị</h3>
                      <p>
                        Chú ý giữ nhịp sinh hoạt điều độ vào các tháng hạn trùng cung có Lưu Tang Môn, Lưu Bạch Hổ hoặc Hóa Kỵ hội chiếu; ưu tiên rèn luyện thể chất và kiểm tra sức khỏe định kỳ.
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: LUẬN GIẢI CHỦ ĐỀ */}
            {activeTab === 'topics' && (
              <div className="space-y-6">
                <div className="flex flex-wrap gap-2">
                  {Object.entries(TOPIC_CONFIG).map(([key, cfg]) => {
                    const active = selectedTopic === key;
                    return (
                      <button
                        key={key}
                        onClick={() => setSelectedTopic(key)}
                        className={`flex items-center gap-2 px-4 py-2.5 rounded-2xl text-xs font-bold border transition ${
                          active
                            ? 'bg-[#244C43] text-[#F3F0E5] border-[#244C43]'
                            : 'bg-[#FAF8F2] text-[#244C43] border-[#D8CFC0] hover:border-[#244C43]'
                        }`}
                      >
                        <LucideIcon name={cfg.icon} className="w-4 h-4 text-[#C5A66A]" />
                        <span>{cfg.title}</span>
                      </button>
                    );
                  })}
                </div>

                {(() => {
                  const topic = TOPIC_CONFIG[selectedTopic];
                  const relatedAnalyses = topic.palaces
                    .map(pName => chart.palaces.find(p => p.name === pName))
                    .filter(Boolean)
                    .map(p => generatePalaceAnalysis(chart, p.chiIdx));

                  return (
                    <div className="bg-[#FAF8F2] rounded-3xl border border-[#D8CFC0] p-6 sm:p-8 space-y-5">
                      <div className="border-b border-[#D8CFC0] pb-4">
                        <h2 className="text-2xl font-serif font-bold text-[#244C43]">{topic.title}</h2>
                        <p className="text-xs text-[#244C43]/75 mt-1">
                          Hệ thống cung liên quan: <strong>{topic.palaces.join(' · ')}</strong>
                        </p>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {relatedAnalyses.map((item, idx) => (
                          <div key={idx} className="p-4 rounded-2xl bg-[#F3F0E5] border border-[#D8CFC0] space-y-2">
                            <div className="flex items-center justify-between">
                              <span className="font-bold text-[#244C43]">
                                Cung {item.palace.name} ({item.palace.chiName})
                              </span>
                              <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-[#244C43]/10 text-[#244C43]">
                                {item.rating}
                              </span>
                            </div>
                            <p className="text-xs leading-relaxed">{item.sections.mainStarsText}</p>
                            <p className="text-xs leading-relaxed text-[#244C43]/85">{item.sections.tptcText}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* TAB 6: TRA CỨU SAO */}
            {activeTab === 'stars' && (
              <div className="space-y-6">
                <div className="bg-[#FAF8F2] p-5 rounded-2xl border border-[#D8CFC0] flex flex-wrap items-center justify-between gap-4">
                  <div className="relative flex-1 min-w-[240px]">
                    <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#244C43]/60">
                      <LucideIcon name="search" className="w-4 h-4" />
                    </span>
                    <input
                      type="text"
                      value={starSearch}
                      onChange={(e) => setStarSearch(e.target.value)}
                      placeholder="Tìm tên chính tinh hoặc phụ tinh (VD: Tử Vi, Thiên Đồng, Hóa Lộc...)"
                      className="w-full pl-10 pr-4 py-2 rounded-xl bg-[#F3F0E5] border border-[#D8CFC0] text-sm focus:outline-none focus:border-[#244C43]"
                    />
                  </div>

                  <div className="flex flex-wrap items-center gap-1.5">
                    {['ALL', 'Kim', 'Mộc', 'Thủy', 'Hỏa', 'Thổ'].map(el => (
                      <button
                        key={el}
                        onClick={() => setElementFilter(el)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                          elementFilter === el
                            ? 'bg-[#244C43] text-[#F3F0E5] border-[#244C43]'
                            : 'bg-[#F3F0E5] text-[#244C43] border-[#D8CFC0]'
                        }`}
                      >
                        {el === 'ALL' ? 'Tất cả Ngũ hành' : el}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <h3 className="font-serif text-lg font-bold text-[#244C43] mb-3">14 Chính Tinh</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {Object.entries(CHINH_TINH_DATA)
                      .filter(([name, info]) => {
                        const matchName = name.toLowerCase().includes(starSearch.toLowerCase());
                        const matchEl = elementFilter === 'ALL' || info.element === elementFilter;
                        return matchName && matchEl;
                      })
                      .map(([name, info]) => {
                        const locatedPalace = chart.palaces.find(p => p.chinhTinh.some(s => s.name === name));
                        return (
                          <div key={name} className="bg-[#FAF8F2] p-4 rounded-2xl border border-[#D8CFC0] space-y-2">
                            <div className="flex items-center justify-between">
                              <span className="font-bold text-base" style={{ color: ELEMENT_COLORS[info.element] }}>
                                {name}
                              </span>
                              <span className="text-xs px-2 py-0.5 rounded bg-[#F3F0E5] border border-[#D8CFC0] font-medium">
                                Hành {info.element} · {info.group}
                              </span>
                            </div>
                            <p className="text-xs leading-relaxed">{info.summary}</p>
                            {locatedPalace && (
                              <div className="text-[11px] text-[#244C43] font-semibold pt-1 border-t border-[#D8CFC0]">
                                Trên lá số hiện tại: Cung {locatedPalace.name} ({locatedPalace.chiName})
                              </div>
                            )}
                          </div>
                        );
                      })}
                  </div>
                </div>

                <div>
                  <h3 className="font-serif text-lg font-bold text-[#244C43] mb-3">Hệ Thống Phụ Tinh</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {Object.entries(PHU_TINH_DATA)
                      .filter(([name, info]) => {
                        const matchName = name.toLowerCase().includes(starSearch.toLowerCase());
                        const matchEl = elementFilter === 'ALL' || info.element === elementFilter;
                        return matchName && matchEl;
                      })
                      .map(([name, info]) => (
                        <div key={name} className="bg-[#FAF8F2] p-3.5 rounded-2xl border border-[#D8CFC0]">
                          <div className="flex items-center justify-between mb-1">
                            <span className="font-bold text-sm" style={{ color: ELEMENT_COLORS[info.element] }}>
                              {name}
                            </span>
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                              info.type === 'cat' ? 'bg-[#3D7954]/15 text-[#2F6544]' : 'bg-[#C45D4B]/15 text-[#B04A38]'
                            }`}>
                              {info.type === 'cat' ? 'Cát tinh' : 'Sát/Bại tinh'} · {info.element}
                            </span>
                          </div>
                          <p className="text-xs text-[#244C43]/80">{info.desc}</p>
                        </div>
                      ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 7: SO SÁNH LÁ SỐ */}
            {activeTab === 'compare' && (
              <div className="space-y-6">
                <div className="bg-[#FAF8F2] p-6 rounded-3xl border border-[#D8CFC0]">
                  <h2 className="font-serif text-xl font-bold text-[#244C43] mb-2">
                    So Sánh Hai Lá Số Hoặc Hai Giờ Sinh
                  </h2>
                  <p className="text-xs text-[#244C43]/75 mb-4">
                    Đối chiếu lá số hiện tại với một lá số đã lưu khác (hoặc tạo bản sao đổi giờ sinh để kiểm tra sự dịch chuyển cung Mệnh – Thân).
                  </p>

                  <div className="flex flex-wrap items-center gap-3">
                    <select
                      value={compareProfileId}
                      onChange={(e) => setCompareProfileId(e.target.value)}
                      className="px-3.5 py-2 rounded-xl bg-[#F3F0E5] border border-[#D8CFC0] text-sm"
                    >
                      {savedProfiles.map(p => (
                        <option key={p.id} value={p.id}>
                          {p.fullName} ({p.day}/{p.month}/{p.year} - {p.hour}h)
                        </option>
                      ))}
                    </select>

                    <button
                      onClick={() => {
                        const altHour = (Number(formInput.hour) + 2) % 24;
                        const altProfile = {
                          ...formInput,
                          id: `alt-hour-${Date.now()}`,
                          fullName: `${formInput.fullName} (Thử giờ ${altHour}h)`,
                          hour: altHour
                        };
                        setSavedProfiles(prev => [altProfile, ...prev]);
                        setCompareProfileId(altProfile.id);
                        notify(`Đã tạo bản đối chiếu giờ ${altHour}h.`);
                      }}
                      className="px-4 py-2 rounded-xl bg-[#244C43] text-[#F3F0E5] text-xs font-bold"
                    >
                      + Tạo bản đối chiếu lệch 1 canh giờ
                    </button>
                  </div>
                </div>

                {(() => {
                  const targetProfile = savedProfiles.find(p => p.id === compareProfileId) || TEST_CASE_1990;
                  const chartB = calculateTuViChart(targetProfile);

                  return (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {[
                        { label: 'Lá Số A (Hiện tại)', data: chart },
                        { label: 'Lá Số B (Đối chiếu)', data: chartB }
                      ].map((item, idx) => (
                        <div key={idx} className="bg-[#FAF8F2] p-6 rounded-3xl border border-[#D8CFC0] space-y-3">
                          <div className="text-xs font-bold uppercase tracking-wider text-[#C5A66A]">{item.label}</div>
                          <h3 className="text-lg font-bold text-[#244C43]">{item.data.input.fullName}</h3>
                          <div className="text-xs space-y-1.5 text-[#1E2B27]">
                            <div>Dương lịch: <strong>{item.data.solarDate.day}/{item.data.solarDate.month}/{item.data.solarDate.year}</strong></div>
                            <div>Âm lịch: <strong>{item.data.lunarDate.day}/{item.data.lunarDate.month}/{item.data.lunarDate.year} ({item.data.canChi.yearCan} {item.data.canChi.yearChi})</strong></div>
                            <div>Bản mệnh: <strong>{item.data.banMenh.napAm.name}</strong> · <strong>{item.data.banMenh.cucInfo.name}</strong></div>
                            <div>Cung Mệnh: <strong>{CHI[item.data.banMenh.menhPos]}</strong> ({item.data.palaces[item.data.banMenh.menhPos].chinhTinh.map(s => s.name).join(', ') || 'Vô Chính Diệu'})</div>
                            <div>Cung Thân: <strong>{CHI[item.data.banMenh.thanPos]}</strong> (Thân cư {item.data.banMenh.thanCuPalaceName})</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </div>
            )}

            {/* TAB 8: HỒ SƠ ĐÃ LƯU */}
            {activeTab === 'saved' && (
              <div className="bg-[#FAF8F2] rounded-3xl border border-[#D8CFC0] p-6 sm:p-8">
                <div className="flex items-center justify-between border-b border-[#D8CFC0] pb-4 mb-5">
                  <div>
                    <h2 className="font-serif text-xl font-bold text-[#244C43]">Hồ Sơ Lá Số Đã Lưu</h2>
                    <p className="text-xs text-[#244C43]/75 mt-1">
                      Dữ liệu được lưu trữ bền vững trên trình duyệt của bạn. Nhấn vào từng hồ sơ để mở lá số.
                    </p>
                  </div>
                  <button
                    onClick={() => setActiveTab('create')}
                    className="px-4 py-2 rounded-xl bg-[#244C43] text-[#F3F0E5] text-xs font-bold"
                  >
                    + Thêm lá số mới
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {savedProfiles.map(prof => {
                    const previewChart = calculateTuViChart(prof);
                    const isCurrent = prof.id === formInput.id;
                    return (
                      <div
                        key={prof.id}
                        className={`p-4 rounded-2xl border transition flex flex-col justify-between ${
                          isCurrent ? 'bg-[#244C43]/[0.07] border-[#244C43]' : 'bg-[#F3F0E5] border-[#D8CFC0]'
                        }`}
                      >
                        <div>
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-sm text-[#244C43]">{prof.fullName}</span>
                            <span className="text-[11px] px-2 py-0.5 rounded bg-[#244C43] text-[#F3F0E5]">{prof.gender}</span>
                          </div>
                          <div className="text-xs text-[#244C43]/80 mt-2 space-y-1">
                            <div>Ngày sinh: {prof.day}/{prof.month}/{prof.year} ({prof.calendarType === 'solar' ? 'DL' : 'ÂL'})</div>
                            <div>Bản mệnh: {previewChart.banMenh.napAm.name} · {previewChart.banMenh.cucInfo.name}</div>
                            <div>Mệnh tại {CHI[previewChart.banMenh.menhPos]} · Thân cư {previewChart.banMenh.thanCuPalaceName}</div>
                          </div>
                        </div>

                        <div className="flex items-center justify-between pt-3 mt-3 border-t border-[#D8CFC0]">
                          <button
                            onClick={() => { setFormInput(prof); setActiveTab('chart'); notify(`Đang xem lá số ${prof.fullName}`); }}
                            className="text-xs font-bold text-[#244C43] hover:underline"
                          >
                            Mở lá số →
                          </button>
                          {savedProfiles.length > 1 && (
                            <button
                              onClick={() => handleDeleteProfile(prof.id)}
                              className="p-1.5 rounded-lg text-[#C45D4B] hover:bg-[#C45D4B]/10"
                              title="Xóa hồ sơ"
                            >
                              <LucideIcon name="trash-2" className="w-4 h-4" />
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
