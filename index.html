    function getLeapMonth(year) {
      return LUNAR_INFO_1900_2100[year - 1900] & 0xf;
    }

    function getLeapDays(year) {
      if (getLeapMonth(year)) {
        return (LUNAR_INFO_1900_2100[year - 1900] & 0x10000) ? 30 : 29;
      }
      return 0;
    }

    function getMonthDays(year, month) {
      return (LUNAR_INFO_1900_2100[year - 1900] & (0x10000 >> month)) ? 30 : 29;
    }

    function getLunarYearDays(year) {
      let sum = 348;
      for (let i = 0x8000; i > 0x8; i >>= 1) {
        sum += (LUNAR_INFO_1900_2100[year - 1900] & i) ? 1 : 0;
      }
      return sum + getLeapDays(year);
    }

    function solarToLunar(sYear, sMonth, sDay) {
      const baseDate = Date.UTC(1900, 0, 31);
      const objDate = Date.UTC(sYear, sMonth - 1, sDay);
      let offset = Math.floor((objDate - baseDate) / 86400000);

      let year = 1900;
      let temp = 0;
      for (year = 1900; year < 2101 && offset > 0; year++) {
        temp = getLunarYearDays(year);
        offset -= temp;
      }
      if (offset < 0) {
        offset += temp;
        year--;
      }

      const leap = getLeapMonth(year);
      let isLeap = false;
      let month = 1;
      for (month = 1; month < 13 && offset > 0; month++) {
        if (leap > 0 && month === (leap + 1) && !isLeap) {
          --month;
          isLeap = true;
          temp = getLeapDays(year);
        } else {
          temp = getMonthDays(year, month);
        }
        if (isLeap && month === (leap + 1)) {
          isLeap = false;
        }
        offset -= temp;
      }

      if (offset === 0 && leap > 0 && month === leap + 1) {
        if (isLeap) {
          isLeap = false;
        } else {
          isLeap = true;
          --month;
        }
      }
      if (offset < 0) {
        offset += temp;
        --month;
      }
      const day = offset + 1;
      return { year, month, day, isLeap };
    }

    function lunarToSolar(lYear, lMonth, lDay, isLeap = false) {
      let offset = 0;
      for (let y = 1900; y < lYear; y++) {
        offset += getLunarYearDays(y);
      }
      const leap = getLeapMonth(lYear);
      for (let m = 1; m < lMonth; m++) {
        offset += getMonthDays(lYear, m);
        if (leap > 0 && m === leap) {
          offset += getLeapDays(lYear);
        }
      }
      if (isLeap && leap === lMonth) {
        offset += getMonthDays(lYear, lMonth);
      }
      offset += lDay - 1;
      const date = new Date(Date.UTC(1900, 0, 31) + offset * 86400000);
      return {
        year: date.getUTCFullYear(),
        month: date.getUTCMonth() + 1,
        day: date.getUTCDate()
      };
    }

     * 3. THUẬT TOÁN LẬP LÁ SỐ TỬ VI TOÀN DIỆN
     */
    function getSexagenaryIndex(canIdx, chiIdx) {
      for (let i = 0; i < 60; i++) {
        if (i % 10 === canIdx && i % 12 === chiIdx) return i;
      }
      return 0;
    }

    function getJulianDayNumber(y, m, d) {
      const a = Math.floor((14 - m) / 12);
      const y1 = y + 4800 - a;
      const m1 = m + 12 * a - 3;
      return d + Math.floor((153 * m1 + 2) / 5) + 365 * y1 + Math.floor(y1 / 4) - Math.floor(y1 / 100) + Math.floor(y1 / 400) - 32045;
    }

    function calculateTuViChart(input) {
      let sYear = Number(input.year);
      let sMonth = Number(input.month);
      let sDay = Number(input.day);
      let lunarDate;

      if (input.calendarType === 'lunar') {
        lunarDate = { year: sYear, month: sMonth, day: sDay, isLeap: Boolean(input.isLeap) };
        const solar = lunarToSolar(sYear, sMonth, sDay, Boolean(input.isLeap));
        sYear = solar.year;
        sMonth = solar.month;
        sDay = solar.day;
      } else {
        lunarDate = solarToLunar(sYear, sMonth, sDay);
      }

      const hour = Number(input.hour);
      let chiHourIdx = Math.floor(((hour + 1) % 24) / 2);
      let dayOffsetForLateZi = 0;
      if (hour === 23 && input.lateZiRule === 'nextDay') {
        dayOffsetForLateZi = 1;
      }

      const yearCanIdx = MOD(lunarDate.year - 4, 10);
      const yearChiIdx = MOD(lunarDate.year - 4, 12);
      const yearCan = CAN[yearCanIdx];
      const yearChi = CHI[yearChiIdx];

      const monthStartCanIdx = MOD((yearCanIdx % 5) * 2 + 2, 10);
      const monthCanIdx = MOD(monthStartCanIdx + (lunarDate.month - 1), 10);
      const monthChiIdx = MOD(2 + (lunarDate.month - 1), 12);
      const monthCan = CAN[monthCanIdx];
      const monthChi = CHI[monthChiIdx];

      const jdn = getJulianDayNumber(sYear, sMonth, sDay) + dayOffsetForLateZi;
      const dayCanIdx = MOD(jdn + 9, 10);
      const dayChiIdx = MOD(jdn + 1, 12);
      const dayCan = CAN[dayCanIdx];
      const dayChi = CHI[dayChiIdx];

      const hourStartCanIdx = MOD((dayCanIdx % 5) * 2, 10);
      const hourCanIdx = MOD(hourStartCanIdx + chiHourIdx, 10);
      const hourCan = CAN[hourCanIdx];

      const sexagenaryIdx = getSexagenaryIndex(yearCanIdx, yearChiIdx);
      const napAm = NAP_AM_60[sexagenaryIdx];

      const isYangYear = yearCanIdx % 2 === 0;
      const isMale = input.gender === 'Nam';
      const amDuong = `${isYangYear ? 'Dương' : 'Âm'} ${isMale ? 'Nam' : 'Nữ'}`;
      const isThuan = (isYangYear && isMale) || (!isYangYear && !isMale);
      const thuanNghich = isThuan ? 'Âm Dương thuận lý' : 'Âm Dương nghịch lý';

      const effectiveLunarMonth = (lunarDate.isLeap && input.leapMonthRule === 'nextMonth')
        ? (lunarDate.month % 12) + 1
        : lunarDate.month;
      const menhPos = MOD(2 + (effectiveLunarMonth - 1) - chiHourIdx, 12);
      const thanPos = MOD(2 + (effectiveLunarMonth - 1) + chiHourIdx, 12);

      const CUC_START_CAN = [2, 4, 6, 8, 0];
      const menhCanIdx = MOD(CUC_START_CAN[yearCanIdx % 5] + MOD(menhPos - 2, 12), 10);
      const CUC_TABLE = [
        [4, 2, 6, 5, 3],
        [2, 6, 5, 3, 4],
        [6, 5, 3, 4, 2],
        [5, 3, 4, 2, 6],
        [3, 4, 2, 6, 5]
      ];
      const chiPairGroup = Math.floor(MOD(menhPos, 6) / 2);
      const cucNumber = CUC_TABLE[Math.floor(menhCanIdx / 2)][chiPairGroup];
      const CUC_DETAILS = {
        2: { name: 'Thủy Nhị Cục', element: 'Thủy', startAge: 2, trangSinhStart: 8 },
        3: { name: 'Mộc Tam Cục', element: 'Mộc', startAge: 3, trangSinhStart: 11 },
        4: { name: 'Kim Tứ Cục', element: 'Kim', startAge: 4, trangSinhStart: 5 },
        5: { name: 'Thổ Ngũ Cục', element: 'Thổ', startAge: 5, trangSinhStart: 8 },
        6: { name: 'Hỏa Lục Cục', element: 'Hỏa', startAge: 6, trangSinhStart: 2 }
      };
      const cucInfo = CUC_DETAILS[cucNumber];

      const ELEMENT_GEN = { Kim: 'Thủy', Thủy: 'Mộc', Mộc: 'Hỏa', Hỏa: 'Thổ', Thổ: 'Kim' };
      const ELEMENT_OVERCOME = { Kim: 'Mộc', Mộc: 'Thổ', Thổ: 'Thủy', Thủy: 'Hỏa', Hỏa: 'Kim' };
      let menhCucRelation = 'Mệnh Cục bình hòa';
      if (napAm.element === cucInfo.element) menhCucRelation = 'Mệnh Cục đồng hành';
      else if (ELEMENT_GEN[cucInfo.element] === napAm.element) menhCucRelation = 'Cục sinh Bản Mệnh';
      else if (ELEMENT_GEN[napAm.element] === cucInfo.element) menhCucRelation = 'Bản Mệnh sinh Cục';
      else if (ELEMENT_OVERCOME[cucInfo.element] === napAm.element) menhCucRelation = 'Cục khắc Bản Mệnh';
      else if (ELEMENT_OVERCOME[napAm.element] === cucInfo.element) menhCucRelation = 'Bản Mệnh khắc Cục';

      const MENH_CHU_BY_CHI = ['Tham Lang', 'Cự Môn', 'Lộc Tồn', 'Văn Khúc', 'Liêm Trinh', 'Vũ Khúc', 'Phá Quân', 'Vũ Khúc', 'Liêm Trinh', 'Văn Khúc', 'Lộc Tồn', 'Cự Môn'];
      const THAN_CHU_BY_CHI = ['Linh Tinh', 'Thiên Tướng', 'Thiên Lương', 'Thiên Đồng', 'Văn Xương', 'Thiên Cơ', 'Hỏa Tinh', 'Thiên Tướng', 'Thiên Lương', 'Thiên Đồng', 'Văn Xương', 'Thiên Cơ'];
      const menhChu = MENH_CHU_BY_CHI[menhPos];
      const thanChu = THAN_CHU_BY_CHI[yearChiIdx];

      const PALACE_NAMES = ['MỆNH', 'PHỤ MẪU', 'PHÚC ĐỨC', 'ĐIỀN TRẠCH', 'QUAN LỘC', 'NÔ BỘC', 'THIÊN DI', 'TẬT ÁCH', 'TÀI BẠCH', 'TỬ TỨC', 'PHU THÊ', 'HUYNH ĐỆ'];
      const TRANG_SINH_NAMES = ['Tràng Sinh', 'Mộc Dục', 'Quan Đới', 'Lâm Quan', 'Đế Vượng', 'Suy', 'Bệnh', 'Tử', 'Mộ', 'Tuyệt', 'Thai', 'Dưỡng'];

      const palaces = Array.from({ length: 12 }, (_, chiIdx) => {
        const palaceOffset = MOD(chiIdx - menhPos, 12);
        const palaceCanIdx = MOD(CUC_START_CAN[yearCanIdx % 5] + MOD(chiIdx - 2, 12), 10);
        const daiHanStep = isThuan ? palaceOffset : MOD(menhPos - chiIdx, 12);
        const daiHanStart = cucInfo.startAge + daiHanStep * 10;
        const trangSinhOffset = isThuan
          ? MOD(chiIdx - cucInfo.trangSinhStart, 12)
          : MOD(cucInfo.trangSinhStart - chiIdx, 12);

        return {
          chiIdx,
          chiName: CHI[chiIdx],
          canName: CAN[palaceCanIdx],
          canChiLabel: `${CAN[palaceCanIdx][0]}.${CHI[chiIdx]}`,
          name: PALACE_NAMES[palaceOffset],
          isMenh: chiIdx === menhPos,
          isThan: chiIdx === thanPos,
          isThuan,
          daiHanStart,
          daiHanEnd: daiHanStart + 9,
          trangSinh: TRANG_SINH_NAMES[trangSinhOffset],
          chinhTinh: [],
          phuTinh: [],
          hasTuan: false,
          hasTriet: false
        };
      });

      const thanCuPalaceName = palaces[thanPos].name;

      // An 14 Chính Tinh
      const day = lunarDate.day;
      let tuViPos = 0;
      if (day % cucNumber === 0) {
        tuViPos = MOD(2 + (day / cucNumber) - 1, 12);
      } else {
        const q = Math.floor(day / cucNumber) + 1;
        const diff = q * cucNumber - day;
        const base = 2 + q - 1;
        tuViPos = diff % 2 === 1 ? MOD(base - diff, 12) : MOD(base + diff, 12);
      }
      const thienPhuPos = MOD(4 - tuViPos, 12);

      const CHINH_TINH_POS = {
        'Tử Vi': tuViPos,
        'Thiên Cơ': MOD(tuViPos - 1, 12),
        'Thái Dương': MOD(tuViPos - 3, 12),
        'Vũ Khúc': MOD(tuViPos - 4, 12),
        'Thiên Đồng': MOD(tuViPos - 5, 12),
        'Liêm Trinh': MOD(tuViPos - 8, 12),
        'Thiên Phủ': thienPhuPos,
        'Thái Âm': MOD(thienPhuPos + 1, 12),
        'Tham Lang': MOD(thienPhuPos + 2, 12),
        'Cự Môn': MOD(thienPhuPos + 3, 12),
        'Thiên Tướng': MOD(thienPhuPos + 4, 12),
        'Thiên Lương': MOD(thienPhuPos + 5, 12),
        'Thất Sát': MOD(thienPhuPos + 6, 12),
        'Phá Quân': MOD(thienPhuPos + 10, 12)
      };

      const TU_HOA_BY_CAN = [
        ['Liêm Trinh', 'Phá Quân', 'Vũ Khúc', 'Thái Dương'],
        ['Thiên Cơ', 'Thiên Lương', 'Tử Vi', 'Thái Âm'],
        ['Thiên Đồng', 'Thiên Cơ', 'Văn Xương', 'Liêm Trinh'],
        ['Thái Âm', 'Thiên Đồng', 'Thiên Cơ', 'Cự Môn'],
        ['Tham Lang', 'Thái Âm', 'Hữu Bật', 'Thiên Cơ'],
        ['Vũ Khúc', 'Tham Lang', 'Thiên Lương', 'Văn Khúc'],
        ['Thái Dương', 'Vũ Khúc', 'Thái Âm', 'Thiên Đồng'],
        ['Cự Môn', 'Thái Dương', 'Văn Khúc', 'Văn Xương'],
        ['Thiên Lương', 'Tử Vi', 'Tả Phù', 'Vũ Khúc'],
        ['Phá Quân', 'Cự Môn', 'Thái Âm', 'Tham Lang']
      ];
      const hoaStars = TU_HOA_BY_CAN[yearCanIdx];
      const HOA_LABELS = ['Hóa Lộc', 'Hóa Quyền', 'Hóa Khoa', 'Hóa Kỵ'];
      const tuHoaList = [];

      Object.entries(CHINH_TINH_POS).forEach(([starName, pos]) => {
        const info = CHINH_TINH_DATA[starName];
        const hoaIdx = hoaStars.indexOf(starName);
        const tuHoa = hoaIdx !== -1 ? HOA_LABELS[hoaIdx] : null;
        if (tuHoa) {
          tuHoaList.push({ hoa: tuHoa, star: starName, palace: palaces[pos].name, chiName: CHI[pos] });
        }
        palaces[pos].chinhTinh.push({
          name: starName,
          element: info.element,
          brightness: info.brightness[pos],
          tuHoa
        });
      });

      const addPhuTinh = (name, pos) => {
        const pIdx = MOD(pos, 12);
        const meta = PHU_TINH_DATA[name] || { element: 'Thổ', type: 'cat' };
        const brightness = meta.brightness ? meta.brightness[pIdx] : null;
        palaces[pIdx].phuTinh.push({
          name,
          element: meta.element,
          type: meta.type,
          brightness
        });
        const hoaIdx = hoaStars.indexOf(name);
        if (hoaIdx !== -1) {
          const tuHoa = HOA_LABELS[hoaIdx];
          palaces[pIdx].phuTinh.push({
            name: tuHoa,
            element: tuHoa === 'Hóa Kỵ' ? 'Thủy' : 'Mộc',
            type: tuHoa === 'Hóa Kỵ' ? 'sat' : 'cat'
          });
          tuHoaList.push({ hoa: tuHoa, star: name, palace: palaces[pIdx].name, chiName: CHI[pIdx] });
        }
      };

      const THAI_TUE_RING = [
        'Thái Tuế', 'Thiếu Dương', 'Tang Môn', 'Thiếu Âm', 'Quan Phù', 'Tử Phù',
        'Tuế Phá', 'Long Đức', 'Bạch Hổ', 'Phúc Đức', 'Điếu Khách', 'Trực Phù'
      ];
      THAI_TUE_RING.forEach((star, i) => addPhuTinh(star, yearChiIdx + i));

      const LOC_TON_POS = [2, 3, 5, 6, 5, 6, 8, 9, 11, 0];
      const locTonPos = LOC_TON_POS[yearCanIdx];
      addPhuTinh('Lộc Tồn', locTonPos);
      addPhuTinh('Kình Dương', locTonPos + 1);
      addPhuTinh('Đà La', locTonPos - 1);

      const BAC_SI_RING = [
        'Bác Sĩ', 'Lực Sĩ', 'Thanh Long', 'Tiểu Hao', 'Tướng Quân', 'Tấu Thư',
        'Phi Liêm', 'Hỷ Thần', 'Bệnh Phù', 'Đại Hao', 'Phục Binh', 'Quan Phủ'
      ];
      BAC_SI_RING.forEach((star, i) => {
        addPhuTinh(star, isThuan ? locTonPos + i : locTonPos - i);
      });

      const taPhuPos = MOD(4 + (effectiveLunarMonth - 1), 12);
      const huuBatPos = MOD(10 - (effectiveLunarMonth - 1), 12);
      const vanXuongPos = MOD(10 - chiHourIdx, 12);
      const vanKhucPos = MOD(4 + chiHourIdx, 12);
      addPhuTinh('Tả Phù', taPhuPos);
      addPhuTinh('Hữu Bật', huuBatPos);
      addPhuTinh('Văn Xương', vanXuongPos);
      addPhuTinh('Văn Khúc', vanKhucPos);

      addPhuTinh('Ân Quang', vanXuongPos + lunarDate.day - 2);
      addPhuTinh('Thiên Quý', vanKhucPos - lunarDate.day + 2);
      addPhuTinh('Tam Thai', taPhuPos + lunarDate.day - 1);
      addPhuTinh('Bát Tọa', huuBatPos - lunarDate.day + 1);
      addPhuTinh('Thai Phụ', vanKhucPos + 2);
      addPhuTinh('Phong Cáo', vanKhucPos - 2);

      const KHOI_VIET_MAP = [
        [1, 7], [0, 8], [11, 9], [11, 9], [1, 7],
        [0, 8], [1, 7], [6, 2], [3, 5], [3, 5]
      ];
      addPhuTinh('Thiên Khôi', KHOI_VIET_MAP[yearCanIdx][0]);
      addPhuTinh('Thiên Việt', KHOI_VIET_MAP[yearCanIdx][1]);

      const QUAN_PHUC_MAP = [
        [7, 9], [4, 8], [5, 0], [2, 11], [3, 3],
        [9, 2], [11, 6], [9, 5], [10, 6], [6, 5]
      ];
      addPhuTinh('Thiên Quan', QUAN_PHUC_MAP[yearCanIdx][0]);
      addPhuTinh('Thiên Phúc', QUAN_PHUC_MAP[yearCanIdx][1]);

      const VAN_TINH_MAP = [5, 6, 8, 9, 8, 9, 11, 0, 2, 3];
      const LUU_HA_MAP = [9, 10, 7, 8, 5, 6, 3, 4, 11, 2];
      const THIEN_TRU_MAP = [5, 6, 0, 5, 6, 8, 2, 6, 9, 10];
      addPhuTinh('Văn Tinh', VAN_TINH_MAP[yearCanIdx]);
      addPhuTinh('Đường Phù', locTonPos + 5);
      addPhuTinh('Quốc Ấn', locTonPos + 8);
      addPhuTinh('Thiên Trù', THIEN_TRU_MAP[yearCanIdx]);
      addPhuTinh('Lưu Hà', LUU_HA_MAP[yearCanIdx]);

      addPhuTinh('Long Trì', 4 + yearChiIdx);
      addPhuTinh('Phượng Các', 10 - yearChiIdx);
      addPhuTinh('Giải Thần', 10 - yearChiIdx);
      addPhuTinh('Thiên Khốc', 6 - yearChiIdx);
      addPhuTinh('Thiên Hư', 6 + yearChiIdx);
      addPhuTinh('Thiên Đức', 9 + yearChiIdx);
      addPhuTinh('Nguyệt Đức', 5 + yearChiIdx);
      addPhuTinh('Hồng Loan', 3 - yearChiIdx);
      addPhuTinh('Thiên Hỷ', 9 - yearChiIdx);

      addPhuTinh('Thiên Hình', 9 + (effectiveLunarMonth - 1));
      addPhuTinh('Thiên Riêu', 1 + (effectiveLunarMonth - 1));
      addPhuTinh('Thiên Y', 1 + (effectiveLunarMonth - 1));
      addPhuTinh('Thiên Giải', 8 + (effectiveLunarMonth - 1));
      addPhuTinh('Địa Giải', 7 + (effectiveLunarMonth - 1));

      const TAM_HOP_STARS = {
        2: { ma: 8, dao: 3, cai: 10, kiep: 11 }, 6: { ma: 8, dao: 3, cai: 10, kiep: 11 }, 10: { ma: 8, dao: 3, cai: 10, kiep: 11 },
        8: { ma: 2, dao: 9, cai: 4, kiep: 5 }, 0: { ma: 2, dao: 9, cai: 4, kiep: 5 }, 4: { ma: 2, dao: 9, cai: 4, kiep: 5 },
        5: { ma: 11, dao: 6, cai: 1, kiep: 2 }, 9: { ma: 11, dao: 6, cai: 1, kiep: 2 }, 1: { ma: 11, dao: 6, cai: 1, kiep: 2 },
        11: { ma: 5, dao: 0, cai: 7, kiep: 8 }, 3: { ma: 5, dao: 0, cai: 7, kiep: 8 }, 7: { ma: 5, dao: 0, cai: 7, kiep: 8 }
      };
      const thStars = TAM_HOP_STARS[yearChiIdx];
      addPhuTinh('Thiên Mã', thStars.ma);
      addPhuTinh('Đào Hoa', thStars.dao);
      addPhuTinh('Hoa Cái', thStars.cai);
      addPhuTinh('Kiếp Sát', thStars.kiep);

      addPhuTinh('Địa Không', 11 - chiHourIdx);
      addPhuTinh('Địa Kiếp', 11 + chiHourIdx);
      const HOA_LINH_START = {
        2: [1, 3], 6: [1, 3], 10: [1, 3],
        8: [2, 10], 0: [2, 10], 4: [2, 10],
        5: [3, 10], 9: [3, 10], 1: [3, 10],
        11: [9, 10], 3: [9, 10], 7: [9, 10]
      };
      const [hoaStart, linhStart] = HOA_LINH_START[yearChiIdx];
      addPhuTinh('Hỏa Tinh', hoaStart + chiHourIdx);
      addPhuTinh('Linh Tinh', linhStart + chiHourIdx);

      const CO_QUA_MAP = [
        [2, 10], [2, 10], [5, 1], [5, 1], [5, 1], [8, 4],
        [8, 4], [8, 4], [11, 7], [11, 7], [11, 7], [2, 10]
      ];
      addPhuTinh('Cô Thần', CO_QUA_MAP[yearChiIdx][0]);
      addPhuTinh('Quả Tú', CO_QUA_MAP[yearChiIdx][1]);
      const PHA_TOAI_MAP = [5, 1, 9, 5, 1, 9, 5, 1, 9, 5, 1, 9];
      addPhuTinh('Phá Toái', PHA_TOAI_MAP[yearChiIdx]);
      addPhuTinh('Thiên La', 4);
      addPhuTinh('Địa Võng', 10);
      addPhuTinh('Thiên Thương', menhPos + 5);
      addPhuTinh('Thiên Sứ', menhPos + 7);
      addPhuTinh('Thiên Tài', menhPos + yearChiIdx);
      addPhuTinh('Thiên Thọ', thanPos + yearChiIdx);
      addPhuTinh('Đẩu Quân', yearChiIdx - (lunarDate.month - 1) + chiHourIdx);

      const giapChiOfWeek = MOD(yearChiIdx - yearCanIdx, 12);
      const tuanPair = [MOD(giapChiOfWeek - 2, 12), MOD(giapChiOfWeek - 1, 12)];
      const TRIET_MAP = [
        [8, 9], [6, 7], [4, 5], [2, 3], [0, 1],
        [8, 9], [6, 7], [4, 5], [2, 3], [0, 1]
      ];
      const trietPair = TRIET_MAP[yearCanIdx];
      for (let i = 0; i < 12; i++) {
        palaces[i].hasTuan = tuanPair.includes(i);
        palaces[i].hasTriet = trietPair.includes(i);
      }

      return {
        input,
        solarDate: { year: sYear, month: sMonth, day: sDay },
        lunarDate,
        canChi: {
          yearCan, yearChi, yearCanIdx, yearChiIdx,
          monthCan, monthChi, dayCan, dayChi,
          hourCan, hourChi: CHI[chiHourIdx], chiHourIdx
        },
        banMenh: {
          napAm, amDuong, thuanNghich, isThuan,
          cucInfo, menhCucRelation,
          menhPos, thanPos, thanCuPalaceName,
          menhChu, thanChu
        },
        palaces,
        tuHoaList
      };
    }

    /**
     * 4. TÍNH TIỂU HẠN, LƯU NIÊN (L.) & SAO ĐẠI VẬN (ĐV.)
     */
    function calculateAnnualFortune(chart, targetYear) {
      const lunarAge = targetYear - chart.lunarDate.year + 1;
      const targetCanIdx = MOD(targetYear - 4, 10);
      const targetChiIdx = MOD(targetYear - 4, 12);
      const targetCan = CAN[targetCanIdx];
      const targetChi = CHI[targetChiIdx];

      const TIEU_HAN_START = {
        2: 4, 6: 4, 10: 4,
        8: 10, 0: 10, 4: 10,
        5: 7, 9: 7, 1: 7,
        11: 1, 3: 1, 7: 1
      };
      const startChi = TIEU_HAN_START[chart.canChi.yearChiIdx];
      const isMale = chart.input.gender === 'Nam';
      const step = MOD(targetChiIdx - chart.canChi.yearChiIdx, 12);
      const tieuHanPos = isMale ? MOD(startChi + step, 12) : MOD(startChi - step, 12);

      const activeDaiHan = chart.palaces.find(
        p => lunarAge >= p.daiHanStart && lunarAge <= p.daiHanEnd
      ) || chart.palaces[chart.banMenh.menhPos];

      const TU_HOA_BY_CAN = [
        ['Liêm Trinh', 'Phá Quân', 'Vũ Khúc', 'Thái Dương'],
        ['Thiên Cơ', 'Thiên Lương', 'Tử Vi', 'Thái Âm'],
        ['Thiên Đồng', 'Thiên Cơ', 'Văn Xương', 'Liêm Trinh'],
        ['Thái Âm', 'Thiên Đồng', 'Thiên Cơ', 'Cự Môn'],
        ['Tham Lang', 'Thái Âm', 'Hữu Bật', 'Thiên Cơ'],
        ['Vũ Khúc', 'Tham Lang', 'Thiên Lương', 'Văn Khúc'],
        ['Thái Dương', 'Vũ Khúc', 'Thái Âm', 'Thiên Đồng'],
        ['Cự Môn', 'Thái Dương', 'Văn Khúc', 'Văn Xương'],
        ['Thiên Lương', 'Tử Vi', 'Tả Phù', 'Vũ Khúc'],
        ['Phá Quân', 'Cự Môn', 'Thái Âm', 'Tham Lang']
      ];
      const LOC_TON_POS = [2, 3, 5, 6, 5, 6, 8, 9, 11, 0];
      const KHOI_VIET_MAP = [
        [1, 7], [0, 8], [11, 9], [11, 9], [1, 7],
        [0, 8], [1, 7], [6, 2], [3, 5], [3, 5]
      ];
      const TAM_HOP_MA_DAO = {
        2: { ma: 8, dao: 3 }, 6: { ma: 8, dao: 3 }, 10: { ma: 8, dao: 3 },
        8: { ma: 2, dao: 9 }, 0: { ma: 2, dao: 9 }, 4: { ma: 2, dao: 9 },
        5: { ma: 11, dao: 6 }, 9: { ma: 11, dao: 6 }, 1: { ma: 11, dao: 6 },
        11: { ma: 5, dao: 0 }, 3: { ma: 5, dao: 0 }, 7: { ma: 5, dao: 0 }
      };

      const luuStarsByPalace = Array.from({ length: 12 }, () => []);
      const dvStarsByPalace = Array.from({ length: 12 }, () => []);

      const addLuuStar = (pos, name, element, isCat) => {
        luuStarsByPalace[MOD(pos, 12)].push({ name, element, isCat });
      };
      addLuuStar(targetChiIdx, 'L. Thái Tuế', 'Hỏa', false);
      addLuuStar(targetChiIdx + 2, 'L. Tang Môn', 'Mộc', false);
      addLuuStar(targetChiIdx + 8, 'L. Bạch Hổ', 'Kim', false);
      addLuuStar(6 - targetChiIdx, 'L. Thiên Khốc', 'Kim', false);
      addLuuStar(6 + targetChiIdx, 'L. Thiên Hư', 'Thủy', false);
      const luuLocPos = LOC_TON_POS[targetCanIdx];
      addLuuStar(luuLocPos, 'L. Lộc Tồn', 'Thổ', true);
      addLuuStar(luuLocPos + 1, 'L. Kình Dương', 'Kim', false);
      addLuuStar(luuLocPos - 1, 'L. Đà La', 'Kim', false);
      addLuuStar(KHOI_VIET_MAP[targetCanIdx][0], 'L. Thiên Khôi', 'Hỏa', true);
      addLuuStar(KHOI_VIET_MAP[targetCanIdx][1], 'L. Thiên Việt', 'Hỏa', true);
      addLuuStar(TAM_HOP_MA_DAO[targetChiIdx].ma, 'L. Thiên Mã', 'Hỏa', true);
      addLuuStar(TAM_HOP_MA_DAO[targetChiIdx].dao, 'L. Đào Hoa', 'Mộc', true);
      addLuuStar(3 - targetChiIdx, 'L. Hồng Loan', 'Thủy', true);

      const luuHoaNames = TU_HOA_BY_CAN[targetCanIdx];
      const HOA_SHORT = ['L. Hóa Lộc', 'L. Hóa Quyền', 'L. Hóa Khoa', 'L. Hóa Kỵ'];
      const luuTuHoa = luuHoaNames.map((starName, idx) => {
        const foundPalace = chart.palaces.find(
          p => p.chinhTinh.some(s => s.name === starName) || p.phuTinh.some(s => s.name === starName)
        );
        const pIdx = foundPalace ? foundPalace.chiIdx : 0;
        addLuuStar(pIdx, HOA_SHORT[idx], idx === 3 ? 'Thủy' : 'Mộc', idx !== 3);
        return {
          hoa: ['Lưu Hóa Lộc', 'Lưu Hóa Quyền', 'Lưu Hóa Khoa', 'Lưu Hóa Kỵ'][idx],
          star: starName,
          palace: foundPalace ? foundPalace.name : 'MỆNH',
          chiName: foundPalace ? foundPalace.chiName : 'Tý'
        };
      });

      const dvCanIdx = CAN.indexOf(activeDaiHan.canName);
      const addDvStar = (pos, name, element, isCat) => {
        dvStarsByPalace[MOD(pos, 12)].push({ name, element, isCat });
      };
      const dvLocPos = LOC_TON_POS[dvCanIdx];
      addDvStar(dvLocPos, 'ĐV. Lộc Tồn', 'Thổ', true);
      addDvStar(dvLocPos + 1, 'ĐV. K Dương', 'Kim', false);
      addDvStar(dvLocPos - 1, 'ĐV. Đà La', 'Kim', false);
      addDvStar(KHOI_VIET_MAP[dvCanIdx][0], 'ĐV. T Khôi', 'Hỏa', true);
      addDvStar(KHOI_VIET_MAP[dvCanIdx][1], 'ĐV. T Việt', 'Hỏa', true);
      addDvStar(TAM_HOP_MA_DAO[activeDaiHan.chiIdx].ma, 'ĐV. T Mã', 'Hỏa', true);

      const dvHoaNames = TU_HOA_BY_CAN[dvCanIdx];
      const DV_HOA_SHORT = ['ĐV. H Lộc', 'ĐV. H Quyền', 'ĐV. H Khoa', 'ĐV. H Kỵ'];
      dvHoaNames.forEach((starName, idx) => {
        const foundPalace = chart.palaces.find(
          p => p.chinhTinh.some(s => s.name === starName) || p.phuTinh.some(s => s.name === starName)
        );
        if (foundPalace) {
          addDvStar(foundPalace.chiIdx, DV_HOA_SHORT[idx], idx === 3 ? 'Thủy' : 'Mộc', idx !== 3);
        }
      });

      const tieuHanChiByPalace = Array.from({ length: 12 }, (_, chiIdx) => {
        const offset = isMale ? MOD(chiIdx - tieuHanPos, 12) : MOD(tieuHanPos - chiIdx, 12);
        return CHI[MOD(targetChiIdx + offset, 12)];
      });

      const month1Pos = MOD(tieuHanPos - (chart.lunarDate.month - 1) + chart.canChi.chiHourIdx, 12);
      const monthLabelsByPalace = Array.from({ length: 12 }, (_, chiIdx) => {
        const m = MOD(chiIdx - month1Pos, 12) + 1;
        return `T.${m}`;
      });

      return {
        targetYear, lunarAge,
        canChi: `${targetCan} ${targetChi}`,
        tieuHanPalace: chart.palaces[tieuHanPos],
        luuNienPalace: chart.palaces[targetChiIdx],
        activeDaiHan, luuTuHoa,
        luuStarsByPalace, dvStarsByPalace,
        tieuHanChiByPalace, monthLabelsByPalace
      };
    }

    /**
     * 5. TAM PHƯƠNG TỨ CHÍNH & BỘ MÁY LUẬN GIẢI TỬ VI TỔNG HỢP (NGUYỄN PHÁT LỘC - 13 CHUYÊN MỤC)
     */
    const SINH_VUONG_BAI_TUYET = {
      'Mộc': { sinh: [11], vuong: [2, 3], bai: [0], tuyet: [8] },
      'Hỏa': { sinh: [2], vuong: [5, 6], bai: [3], tuyet: [11] },
      'Thổ': { sinh: [5], vuong: [4, 10, 1, 7], bai: [6], tuyet: [2] },
      'Kim': { sinh: [4, 10], vuong: [8, 9], bai: [1, 7], tuyet: [6] },
      'Thủy': { sinh: [9], vuong: [11, 0], bai: [8], tuyet: [4, 10] }
    };

    const CHI_ELEMENT = ['Thủy', 'Thổ', 'Mộc', 'Mộc', 'Thổ', 'Hỏa', 'Hỏa', 'Thổ', 'Kim', 'Kim', 'Thổ', 'Thủy'];
    const NAM_DAU_STARS = ['Thiên Phủ', 'Thiên Lương', 'Thiên Cơ', 'Thiên Đồng', 'Thiên Tướng', 'Thất Sát', 'Thái Dương'];
    const BAC_DAU_STARS = ['Tham Lang', 'Cự Môn', 'Liêm Trinh', 'Vũ Khúc', 'Phá Quân', 'Thái Âm'];

    function evaluateLoiDia(element, chiIdx) {
      const rule = SINH_VUONG_BAI_TUYET[element];
      if (!rule) return 'Bình địa';
      if (rule.sinh.includes(chiIdx)) return 'Sinh địa (Thuận Âm Dương & Ngũ Hành)';
      if (rule.vuong.includes(chiIdx)) return 'Vượng địa (Đồng hành Ngũ Hành)';
      if (rule.bai.includes(chiIdx)) return 'Bại địa (Đồng hành nhưng nghịch Âm Dương)';
      if (rule.tuyet.includes(chiIdx)) return 'Tuyệt địa (Nghịch cả Âm Dương lẫn Ngũ Hành)';
      return 'Bình địa (Trung hòa)';
    }

    function evaluateThreeTierElement(palaceEl, mainStarEl, baseEl) {
      const GEN = { Kim: 'Thủy', Thủy: 'Mộc', Mộc: 'Hỏa', Hỏa: 'Thổ', Thổ: 'Kim' };
      const OVER = { Kim: 'Mộc', Mộc: 'Thổ', Thổ: 'Thủy', Thủy: 'Hỏa', Hỏa: 'Kim' };
      const rel = (a, b) => (GEN[a] === b ? 'sinh' : a === b ? 'hoa' : OVER[a] === b ? 'khac' : 'binh');

      if (!mainStarEl) {
        const r = rel(palaceEl, baseEl);
        if (r === 'sinh') return `Cung (${palaceEl}) tương sinh Bản Mệnh (${baseEl}) — môi trường nâng đỡ.`;
        if (r === 'khac') return `Cung (${palaceEl}) khắc Bản Mệnh (${baseEl}) — hoàn cảnh đòi hỏi tự lực cao.`;
        return `Cung (${palaceEl}) và Bản Mệnh (${baseEl}) ở thế trung hòa.`;
      }
      const r1 = rel(palaceEl, mainStarEl);
      const r2 = rel(mainStarEl, baseEl);
      if (r1 === 'sinh' && r2 === 'sinh') return `Thượng cách tương sinh: Cung (${palaceEl}) sinh Chính tinh (${mainStarEl}), Chính tinh sinh Bản Mệnh (${baseEl}).`;
      if (r2 === 'sinh') return `Chính tinh (${mainStarEl}) tương sinh Bản Mệnh (${baseEl}) — hưởng phúc lực trực tiếp từ chủ tinh.`;
      if (r2 === 'hoa') return `Chính tinh (${mainStarEl}) đồng hành Bản Mệnh (${baseEl}) — tính chất sao hòa hợp cốt cách.`;
      if (r2 === 'khac') return `Chính tinh (${mainStarEl}) khắc Bản Mệnh (${baseEl}) — tạo áp lực tôi luyện ý chí vượt ngưỡng.`;
      return `Tương quan Cung (${palaceEl}) – Chính tinh (${mainStarEl}) – Bản Mệnh (${baseEl}) ở thế cân bằng động.`;
    }

    function getTamPhuongTuChinh(chart, chiIdx) {
      const tamHop1 = MOD(chiIdx + 4, 12);
      const tamHop2 = MOD(chiIdx + 8, 12);
      const xungChieu = MOD(chiIdx + 6, 12);
      const giapTruoc = MOD(chiIdx - 1, 12);
      const giapSau = MOD(chiIdx + 1, 12);
      const NHI_HOP_MAP = [1, 0, 11, 10, 9, 8, 7, 6, 5, 4, 3, 2];
      const nhiHop = NHI_HOP_MAP[chiIdx];
      return {
        chinhCung: chart.palaces[chiIdx],
        tamHop1: chart.palaces[tamHop1],
        tamHop2: chart.palaces[tamHop2],
        xungChieu: chart.palaces[xungChieu],
        giapTruoc: chart.palaces[giapTruoc],
        giapSau: chart.palaces[giapSau],
        nhiHop: chart.palaces[nhiHop],
        indices: [chiIdx, tamHop1, tamHop2, xungChieu]
      };
    }

    function detectCachCuc(chart, tptc) {
      const allStars = [
        ...tptc.chinhCung.chinhTinh,
        ...tptc.tamHop1.chinhTinh,
        ...tptc.tamHop2.chinhTinh,
        ...tptc.xungChieu.chinhTinh
      ].map(s => s.name);

      const allAux = [
        ...tptc.chinhCung.phuTinh,
        ...tptc.tamHop1.phuTinh,
        ...tptc.tamHop2.phuTinh,
        ...tptc.xungChieu.phuTinh
      ].map(s => s.name);

      const hasAll = (list) => list.every(s => allStars.includes(s));
      let cachName = 'Cách cục phối hợp đa nguyên';
      if (tptc.chinhCung.chinhTinh.length === 0) {
        const kCount = [
          tptc.chinhCung.hasTuan,
          tptc.chinhCung.hasTriet,
          allAux.includes('Địa Không'),
          allAux.includes('Thiên Không')
        ].filter(Boolean).length;
        cachName = kCount >= 3
          ? 'Vô Chính Diệu đắc Tam/Tứ Không (Phản vi kỳ cách)'
          : (tptc.chinhCung.hasTuan || tptc.chinhCung.hasTriet)
          ? 'Vô Chính Diệu đắc Tuần/Triệt án ngữ (Đắc Nhị Không)'
          : 'Vô Chính Diệu mượn chính tinh xung chiếu';
      } else if (hasAll(['Tử Vi', 'Thiên Phủ', 'Vũ Khúc', 'Thiên Tướng'])) {
        cachName = 'Tử Phủ Vũ Tướng (Văn võ kiêm toàn, quyền quý ổn định)';
      } else if (hasAll(['Thất Sát', 'Phá Quân', 'Liêm Trinh', 'Tham Lang'])) {
        cachName = 'Sát Phá Liêm Tham (Cải cách, tiên phong, bứt phá mạnh mẽ)';
      } else if (hasAll(['Thiên Cơ', 'Thái Âm', 'Thiên Đồng', 'Thiên Lương'])) {
        cachName = 'Cơ Nguyệt Đồng Lương (Tham mưu, học thuật, quản trị hành chính)';
      } else if (allStars.includes('Cự Môn') && allStars.includes('Thái Dương')) {
        cachName = 'Cự Nhật đồng hội (Hùng biện, chính trị, ngoại giao, pháp lý)';
      } else if (allStars.includes('Thái Dương') && allStars.includes('Thái Âm')) {
        cachName = 'Nhật Nguyệt tịnh minh / hội chiếu (Trí tuệ, danh vọng và điền tài)';
      }

      const badges = [];
      if (['Hóa Lộc', 'Hóa Quyền', 'Hóa Khoa'].every(h => allAux.includes(h) || tptc.indices.some(idx => chart.palaces[idx].chinhTinh.some(c => c.tuHoa === h)))) {
        badges.push('Tam Hóa Liên Châu / Hội Chiếu');
      }
      if (allAux.includes('Tả Phù') && allAux.includes('Hữu Bật')) badges.push('Tả Hữu Phò Tá');
      if (allAux.includes('Văn Xương') && allAux.includes('Văn Khúc')) badges.push('Xương Khúc Văn Tinh');
      if (allAux.includes('Thiên Khôi') && allAux.includes('Thiên Việt')) badges.push('Khôi Việt Quý Nhân');
      if (['Long Trì', 'Phượng Các', 'Bạch Hổ', 'Hoa Cái'].every(s => allAux.includes(s))) badges.push('Tứ Linh Cái Hổ');

      const satCount = ['Địa Không', 'Địa Kiếp', 'Kình Dương', 'Đà La', 'Hỏa Tinh', 'Linh Tinh'].filter(s => allAux.includes(s)).length;
      const thuanTap = satCount === 0
        ? 'Thuần cách (Cát tinh hội tụ thuần nhất)'
        : satCount <= 2
        ? 'Phối cách (Cát hung đan xen, cần điều hòa cương nhu)'
        : 'Biến cách (Nhiều sát tinh hội chiếu — thành công qua va chạm)';

      return { cachName, badges, thuanTap };
    }

    function generatePalaceAnalysis(chart, chiIdx) {
      const tptc = getTamPhuongTuChinh(chart, chiIdx);
      const palace = tptc.chinhCung;
      const meta = PALACE_DESCRIPTIONS[palace.name];

      const isVCD = palace.chinhTinh.length === 0;
      const effectiveMainStars = isVCD ? tptc.xungChieu.chinhTinh : palace.chinhTinh;
      const cachInfo = detectCachCuc(chart, tptc);

      const catStars = palace.phuTinh.filter(s => s.type === 'cat');
      const satStars = palace.phuTinh.filter(s => s.type === 'sat');

      const relatedChinhTinh = [
        ...tptc.tamHop1.chinhTinh.map(s => `${s.name} (${s.brightness}) tại ${tptc.tamHop1.name}`),
        ...tptc.tamHop2.chinhTinh.map(s => `${s.name} (${s.brightness}) tại ${tptc.tamHop2.name}`),
        ...tptc.xungChieu.chinhTinh.map(s => `${s.name} (${s.brightness}) tại ${tptc.xungChieu.name}`)
      ];

      const allFourIndices = tptc.indices;
      const relatedTuHoa = chart.tuHoaList.filter(th => {
        const p = chart.palaces.find(item => item.name === th.palace);
        return p && allFourIndices.includes(p.chiIdx);
      });

      const giapStars = [...tptc.giapTruoc.phuTinh, ...tptc.giapSau.phuTinh].map(s => s.name);
      const hasGiapCat = ['Tả Phù', 'Hữu Bật', 'Văn Xương', 'Văn Khúc', 'Thiên Khôi', 'Thiên Việt', 'Hóa Lộc', 'Hóa Quyền', 'Hóa Khoa', 'Lộc Tồn'].some(s => giapStars.includes(s));
      const hasGiapSat = ['Địa Không', 'Địa Kiếp', 'Kình Dương', 'Đà La', 'Hỏa Tinh', 'Linh Tinh', 'Hóa Kỵ'].some(s => giapStars.includes(s));

      let score = 0;
      effectiveMainStars.forEach(s => {
        if (s.brightness === 'M' || s.brightness === 'V') score += 2;
        else if (s.brightness === 'Đ') score += 1;
        else if (s.brightness === 'H') score -= 1;
      });
      score += Math.min(catStars.length * 0.4, 2.5);
      score -= Math.min(satStars.length * 0.4, 2.5);
      if (hasGiapCat) score += 0.6;
      if (hasGiapSat) score -= 0.5;
      if (isVCD && (palace.hasTuan || palace.hasTriet)) score += 1.5;
      relatedTuHoa.forEach(th => {
        if (th.hoa === 'Hóa Kỵ') score -= 1;
        else score += 1;
      });

      let rating = 'Bình ổn';
      if (score >= 2) rating = 'Thuận';
      else if (score <= -1.2) rating = 'Cần giữ';

      const threeTierText = evaluateThreeTierElement(
        CHI_ELEMENT[chiIdx],
        effectiveMainStars[0]?.element,
        chart.banMenh.napAm.element
      );

      const tuanTrietNotes = [];
      if (palace.hasTriet) {
        tuanTrietNotes.push(`Triệt Lộ Không Vong án ngữ tại ${palace.name} (${palace.chiName}): tạo sự ngăn trở, bế tắc hoặc thay đổi hướng đi rõ nét ở tiền vận (trước tuổi 30), càng về hậu vận càng giảm dần sức cản.`);
      }
      if (palace.hasTuan) {
        tuanTrietNotes.push(`Tuần Trung Không Vong vây hãm tại ${palace.name} (${palace.chiName}): mang tính kìm hãm âm ỉ, làm chậm nhịp phát triển ban đầu nhưng giúp tiết chế bớt sự bộc phát của sát tinh.`);
      }
      if (isVCD && (palace.hasTuan || palace.hasTriet)) {
        tuanTrietNotes.push(`Đặc biệt vì cung này Vô Chính Diệu gặp Tuần/Triệt (cách Đắc Nhị Không) nên không hề yếu, trái lại có điểm tựa vững chắc để thu hút trọn vẹn ánh sáng từ cung xung chiếu ${tptc.xungChieu.name}.`);
      }

      const targetPerspective = palace.name === 'PHU THÊ'
        ? 'Luận về người bạn đời (hôn phối) và đời sống lứa đôi: '
        : palace.name === 'PHỤ MẪU'
        ? 'Luận về cha mẹ, gia giáo và cấp trên: '
        : palace.name === 'TỬ TỨC'
        ? 'Luận về con cái và thế hệ kế cận: '
        : palace.name === 'HUYNH ĐỆ'
        ? 'Luận về anh chị em ruột thịt và bạn đồng trang lứa: '
        : palace.name === 'NÔ BỘC'
        ? 'Luận về bạn bè, đồng nghiệp và cộng sự: '
        : '';

      const overview = `${targetPerspective}${meta.focus} ${threeTierText} Nhị hợp với cung ${tptc.nhiHop.name} (${tptc.nhiHop.chiName}) và chịu sự tương tác giáp biên của hai cung ${tptc.giapTruoc.name} – ${tptc.giapSau.name}.`;

      const mainStarsText = isVCD
        ? `Cung ${palace.name} (${palace.chiName}) ở thế Vô Chính Diệu, mượn bộ chính tinh ${effectiveMainStars.map(s => `${s.name} (${s.brightness})`).join(' và ')} từ cung xung chiếu ${tptc.xungChieu.name} (${tptc.xungChieu.chiName}) làm trục chủ đạo (${cachInfo.cachName}).`
        : `Cung ${palace.name} (${palace.chiName}) có ${palace.chinhTinh.map(s => `${s.name} (${s.brightness === 'M' ? 'Miếu' : s.brightness === 'V' ? 'Vượng' : s.brightness === 'Đ' ? 'Đắc' : s.brightness === 'B' ? 'Bình' : 'Hãm'})`).join(' đồng cung ')} tọa thủ — thuộc ${cachInfo.cachName}.`;

      const strengthsText = `${catStars.length > 0 ? `Hội tụ cát tinh ${catStars.slice(0, 6).map(s => s.name).join(', ')}` : 'Nương tựa vào cát tinh từ tam hợp chiếu về'}${hasGiapCat ? `, lại được hai cung giáp (${tptc.giapTruoc.name}, ${tptc.giapSau.name}) phò trợ cát khí` : ''}. ${cachInfo.badges.length > 0 ? `Nổi bật bộ cách: ${cachInfo.badges.join(', ')}.` : ''} ${effectiveMainStars.map(s => CHINH_TINH_DATA[s.name]?.favorable).filter(Boolean).join(' ')}`;

      const challengesText = `${satStars.length > 0 ? `Có sự góp mặt của ${satStars.slice(0, 5).map(s => s.name).join(', ')} tạo lực ma sát và thử thách.` : 'Ít chịu áp lực trực diện từ sát tinh nặng.'} ${tuanTrietNotes.join(' ')} ${effectiveMainStars.map(s => CHINH_TINH_DATA[s.name]?.caution).filter(Boolean).join(' ')}`;

      const tptcText = `Xét đủ 7 cung liên đới (Bản cung ${palace.name}, Xung chiếu ${tptc.xungChieu.name}, Tam hợp ${tptc.tamHop1.name} – ${tptc.tamHop2.name}, Nhị hợp ${tptc.nhiHop.name}), lực lượng chính tinh hội chiếu gồm ${relatedChinhTinh.join('; ')}. ${relatedTuHoa.length > 0 ? `Tứ Hóa hội hợp: ${relatedTuHoa.map(th => `${th.hoa} (${th.star}) tại ${th.palace}`).join(', ')}.` : ''}`;

      const adviceText = `Theo tinh thần "Nhân định thắng thiên" của Tử Vi Tổng Hợp (Nguyễn Phát Lộc), để tối ưu vận khí tại cung ${palace.name}, cần điều hòa 4 yếu tố Trí – Sức – Đức – Chí: phát huy thế mạnh ${cachInfo.thuanTap.toLowerCase()}, chủ động quản trị rủi ro tại các giai đoạn có sát tinh hoặc Tuần/Triệt tác động.`;

      return {
        palace, tptc, meta, isVCD, effectiveMainStars,
        catStars, satStars, relatedTuHoa, rating, cachInfo,
        sections: {
          overview,
          mainStarsText,
          strengthsText,
          challengesText,
          tptcText,
          adviceText
        }
      };
    }

    function generateDetailed13Sections(chart, annualFortune) {
      const getP = (name) => chart.palaces.find(p => p.name === name);
      const getStars = (p) => [...p.chinhTinh.map(s => s.name), ...p.phuTinh.map(s => s.name)];
      const hasAny = (list, targets) => targets.some(t => list.includes(t));

      const menhP = getP('MỆNH');
      const thanP = chart.palaces[chart.banMenh.thanPos];
      const phuTheP = getP('PHU THÊ');
      const taiP = getP('TÀI BẠCH');
      const quanP = getP('QUAN LỘC');
      const phuMauP = getP('PHỤ MẪU');
      const diP = getP('THIÊN DI');
      const tatP = getP('TẬT ÁCH');
      const noP = getP('NÔ BỘC');
      const dienP = getP('ĐIỀN TRẠCH');
      const tuP = getP('TỬ TỨC');
      const baoP = getP('HUYNH ĐỆ');
      const phucP = getP('PHÚC ĐỨC');

      const menhTPTC = getTamPhuongTuChinh(chart, menhP.chiIdx);
      const menhAllStars = menhTPTC.indices.flatMap(i => getStars(chart.palaces[i]));
      const phuTheTPTC = getTamPhuongTuChinh(chart, phuTheP.chiIdx);
      const phuTheAllStars = phuTheTPTC.indices.flatMap(i => getStars(chart.palaces[i]));
      const quanTPTC = getTamPhuongTuChinh(chart, quanP.chiIdx);
      const quanAllStars = quanTPTC.indices.flatMap(i => getStars(chart.palaces[i]));
      const taiTPTC = getTamPhuongTuChinh(chart, taiP.chiIdx);
      const taiAllStars = taiTPTC.indices.flatMap(i => getStars(chart.palaces[i]));

      const mainMenhStars = menhP.chinhTinh.length > 0 ? menhP.chinhTinh : menhTPTC.xungChieu.chinhTinh;
      const mainMenhNames = mainMenhStars.map(s => s.name);

      let vocDang = 'Vóc dáng cân đối, thanh tú, thần thái hài hòa theo ngũ hành ' + chart.banMenh.napAm.element + '.';
      if (hasAny(mainMenhNames, ['Tử Vi', 'Thiên Phủ', 'Vũ Khúc', 'Thái Âm'])) vocDang = 'Thân hình đầy đặn, khung xương vững chắc, gương mặt vuông đầy hoặc phúc hậu, phong thái đĩnh đạc, uy nghi.';
      else if (hasAny(mainMenhNames, ['Thiên Cơ', 'Thiên Lương', 'Thất Sát'])) vocDang = 'Dáng người thon gọn, cao ráo, đường nét thanh tú, ánh mắt tinh anh, tác phong nhanh nhẹn.';
      else if (hasAny(mainMenhNames, ['Thiên Đồng'])) vocDang = 'Dáng người nở nang, phúc hậu, làn da sáng, nét mặt trẻ lâu, hiền hòa và dễ tạo thiện cảm.';
      else if (hasAny(mainMenhNames, ['Tham Lang', 'Phá Quân'])) vocDang = 'Thân hình rắn rỏi, năng động, thần sắc cuốn hút, lông tóc rậm và khí chất mạnh mẽ.';

      const iqScore = hasAny(menhAllStars, ['Thiên Cơ', 'Thái Dương', 'Thái Âm', 'Hóa Khoa', 'Văn Xương', 'Văn Khúc', 'Thiên Khôi', 'Thiên Việt'])
        ? '120 – 135 (Tư duy phân tích sắc bén, nhạy bén hệ thống & trực giác cao)'
        : '110 – 122 (Tư duy thực tế, khả năng thích nghi và học hỏi linh hoạt)';

      const mainSpouseStars = phuTheP.chinhTinh.length > 0 ? phuTheP.chinhTinh : phuTheTPTC.xungChieu.chinhTinh;
      const daoHoaCount = ['Đào Hoa', 'Hồng Loan', 'Thiên Riêu', 'Thai', 'Mộc Dục', 'Hoa Cái', 'Tham Lang'].filter(s => phuTheAllStars.includes(s)).length;

      const isBusinessType = hasAny(taiAllStars, ['Vũ Khúc', 'Thiên Phủ', 'Tham Lang', 'Lộc Tồn', 'Hóa Lộc', 'Thiên Mã', 'Đại Hao', 'Tiểu Hao']);
      const isScholarAdminType = hasAny(quanAllStars, ['Thiên Cơ', 'Cự Môn', 'Thiên Lương', 'Thiên Đồng', 'Thái Dương', 'Văn Xương', 'Văn Khúc', 'Hóa Khoa']);

      const effectiveTuStars = tuP.chinhTinh.length > 0 ? tuP.chinhTinh : getTamPhuongTuChinh(chart, tuP.chiIdx).xungChieu.chinhTinh;
      const namDauCount = effectiveTuStars.filter(s => NAM_DAU_STARS.includes(s.name)).length;
      const bacDauCount = effectiveTuStars.filter(s => BAC_DAU_STARS.includes(s.name)).length;
      let childGenderNote = 'Cân bằng cả con trai và con gái.';
      if (namDauCount > bacDauCount) childGenderNote = 'Thiên về con trai nhiều hơn con gái (Nam Đẩu tinh chủ đạo).';
      else if (bacDauCount > namDauCount) childGenderNote = 'Thiên về con gái nhiều hơn con trai (Bắc Đẩu tinh chủ đạo).';
      else if (effectiveTuStars.some(s => s.name === 'Tử Vi')) childGenderNote = tuP.chiIdx % 2 === 0 ? 'Cung Dương có Tử Vi: có duyên sinh quý tử.' : 'Cung Âm có Tử Vi: con gái đầu lòng hoặc con gái nổi trội.';

      const sortedDaiHan = [...chart.palaces].sort((a, b) => a.daiHanStart - b.daiHanStart);
      const scoredDaiHan = sortedDaiHan.map(p => {
        const a = generatePalaceAnalysis(chart, p.chiIdx);
        return { palace: p, rating: a.rating, cach: a.cachInfo.cachName, hasTuanTriet: p.hasTuan || p.hasTriet };
      });
      const bestDaiHan = scoredDaiHan.filter(d => d.rating === 'Thuận').slice(0, 3);
      const cautionDaiHan = scoredDaiHan.filter(d => d.rating === 'Cần giữ' || d.hasTuanTriet).slice(0, 3);

      const daiHanMainNames = annualFortune.activeDaiHan.chinhTinh.length > 0
        ? annualFortune.activeDaiHan.chinhTinh.map(s => s.name).join(' & ')
        : 'mượn sao từ cung đối diện';
      const tieuHanMainNames = annualFortune.tieuHanPalace.chinhTinh.length > 0
        ? annualFortune.tieuHanPalace.chinhTinh.map(s => s.name).join(' & ')
        : 'mượn sao từ cung đối diện';

      return [
        {
          id: 'sec-1',
          num: '01',
          title: 'Bản Mệnh Toàn Diện (Vóc Dáng, IQ, Tính Cách & Sức Khỏe)',
          palaceRef: `Cung Mệnh tại ${menhP.chiName} · Thân cư ${thanP.name} (${thanP.chiName}) · Nhị hợp ${menhTPTC.nhiHop.name} · Giáp ${menhTPTC.giapTruoc.name} & ${menhTPTC.giapSau.name}`,
          items: [
            { label: 'Vóc dáng trưởng thành', text: vocDang },
            { label: 'Tính cách & Tư chất', text: `Cốt cách chịu ảnh hưởng trực tiếp từ ${mainMenhStars.map(s => `${s.name} (${s.brightness})`).join(', ')}. ${chart.banMenh.thuanNghich} kết hợp ${chart.banMenh.menhCucRelation} tạo nên người ${chart.banMenh.thuanNghich.includes('thuận') ? 'dễ hòa nhập với thời cuộc, hành sự thuận đà' : 'có nội tâm sâu sắc, giàu nghị lực tự thân vượt qua nghịch cảnh'}.` },
            { label: 'Chỉ số IQ & Tư duy', text: `Ước lượng chỉ số tư duy đạt mức ${iqScore}. Điểm mạnh nằm ở khả năng xâu chuỗi dữ kiện và nhìn nhận vấn đề đa chiều.` },
            { label: 'Tài năng & Học vấn', text: `${hasAny(menhAllStars, ['Văn Xương', 'Văn Khúc', 'Hóa Khoa', 'Thiên Khôi', 'Thiên Việt', 'Thai Phụ', 'Phong Cáo']) ? 'Hội tụ văn tinh và khoa giáp tinh trong tam phương tứ chính nên có năng khiếu học thuật, nghiên cứu chuyên sâu, bằng cấp tốt.' : 'Thiên về năng lực thực hành, học hỏi qua trải nghiệm thực tế và tích lũy kỹ năng nghề nghiệp.'}` },
            { label: 'Khả năng giao tiếp', text: `${hasAny(menhAllStars, ['Cự Môn', 'Lưu Hà', 'Tấu Thư', 'Thái Tuế', 'Thái Dương', 'Tham Lang']) ? 'Ngôn ngữ sắc sảo, có sức thuyết phục, biết cách diễn đạt ý tưởng rõ ràng và tạo dấu ấn trong đám đông.' : 'Giao tiếp chân thành, điềm đạm, trọng chữ tín hơn lời nói hoa mỹ.'}` },
            { label: 'Nền tảng sức khỏe', text: `Bản mệnh ${chart.banMenh.napAm.name} (${chart.banMenh.napAm.element}) đóng tại ${menhP.chiName} (${evaluateLoiDia(chart.banMenh.napAm.element, menhP.chiIdx)}). Cần chú ý điều hòa khí huyết và giữ nhịp sinh hoạt cân bằng giữa làm việc trí óc và nghỉ ngơi.` }
          ]
        },
        {
          id: 'sec-2',
          num: '02',
          title: 'Cung Phu Thê (Hôn Nhân, Chân Dung Bạn Đời & Đào Hoa)',
          palaceRef: `Cung Phu Thê tại ${phuTheP.chiName} · Xung chiếu ${phuTheTPTC.xungChieu.name} · Tam hợp ${phuTheTPTC.tamHop1.name}, ${phuTheTPTC.tamHop2.name} · Nhị hợp ${phuTheTPTC.nhiHop.name}`,
          items: [
            { label: 'Chân dung & Gia thế vợ/chồng', text: `Người hôn phối mang khí chất của ${mainSpouseStars.map(s => `${s.name} (${s.brightness})`).join(' và ')}: ${mainSpouseStars.map(s => CHINH_TINH_DATA[s.name]?.summary).filter(Boolean).join(' ')} ${hasAny(phuTheAllStars, ['Tả Phù', 'Hữu Bật', 'Thiên Khôi', 'Thiên Việt', 'Hóa Lộc', 'Lộc Tồn', 'Thiên Phủ']) ? 'Gia thế người bạn đời có nền tảng ổn định, có năng lực hỗ trợ kinh tế hoặc vị thế cho đương số.' : 'Hai vợ chồng chủ yếu cùng nhau tự lập, gây dựng cơ nghiệp từ thực lực.'}` },
            { label: 'Đời sống tình cảm & Hạnh phúc', text: `${phuTheP.hasTriet || phuTheP.hasTuan ? `Cung Phu Thê có ${phuTheP.hasTriet ? 'Triệt' : ''}${phuTheP.hasTriet && phuTheP.hasTuan ? ' và ' : ''}${phuTheP.hasTuan ? 'Tuần' : ''} án ngữ: tình duyên buổi đầu (trước 30 tuổi) dễ gặp trắc trở, hiểu lầm hoặc phải trải qua thử thách chia xa rồi mới tìm được bến đỗ vững bền. Kết hôn muộn một chút sẽ rất có lợi cho gia đạo.` : 'Đời sống vợ chồng có sự gắn kết tự nhiên, tuy nhiên vẫn cần tôn trọng không gian riêng của nhau.'}` },
            { label: 'Mức độ đào hoa & Lưu ý', text: `Mức độ đào hoa đánh giá ở mức ${daoHoaCount >= 3 ? 'Cao (có sức hút lớn với người khác phái, dễ có nhiều mối quan tâm tình cảm)' : daoHoaCount >= 1 ? 'Trung bình (có duyên ngầm, biết chăm chút hình ảnh)' : 'Chừng mực, nghiêm túc trong tình cảm'}. Cần đề phòng sự can thiệp của người thứ ba hoặc tính tự ái làm rạn nứt hòa khí.` }
          ]
        },
        {
          id: 'sec-3',
          num: '03',
          title: 'Tài Sản & Nghề Nghiệp (Tài Chính, Độ Giàu Có & Cách Kiếm Tiền)',
          palaceRef: `Cung Tài Bạch tại ${taiP.chiName} · Quan Lộc tại ${quanP.chiName} · Điền Trạch tại ${dienP.chiName}`,
          items: [
            { label: 'Đánh giá tài chính & Độ giàu có', text: `Trục Tài – Phúc – Quan hội tụ ${taiAllStars.filter(s => ['Vũ Khúc', 'Thiên Phủ', 'Thái Âm', 'Thái Dương', 'Lộc Tồn', 'Hóa Lộc', 'Hóa Quyền', 'Thiên Mã'].includes(s)).join(', ') || 'bộ sao tích lũy ổn định'}. ${taiP.isThan ? 'Vì Thân cư Tài Bạch nên hậu vận rất chú trọng kinh tế và có khả năng tạo dựng tài sản vững chắc bằng năng lực chuyên môn.' : 'Tài lộc tăng trưởng tỷ lệ thuận với uy tín nghề nghiệp và khả năng quản trị dòng tiền.'}` },
            { label: 'Ngành nghề phù hợp', text: `${isBusinessType && isScholarAdminType ? 'Hợp cả lĩnh vực quản trị tài chính, kinh doanh dịch vụ lẫn chuyên môn tư vấn, đào tạo, công nghệ.' : isBusinessType ? 'Phù hợp kinh doanh thương mại, tài chính, ngân hàng, bất động sản, quản lý chuỗi cung ứng hoặc đầu tư.' : 'Phù hợp các ngành chuyên môn sâu, hành chính, giáo dục, luật pháp, kỹ thuật, y dược hoặc quản trị hệ thống.'}` },
            { label: 'Phương thức kiếm tiền', text: `${hasAny(taiAllStars, ['Đại Hao', 'Tiểu Hao', 'Thiên Mã', 'Thất Sát', 'Phá Quân']) ? 'Tiền bạc luân chuyển nhanh, kiếm tiền theo dự án hoặc thương mại lưu động; nên trích lập quỹ dự phòng cố định để giữ thành quả.' : 'Tích tiểu thành đại, kiếm tiền bền vững từ uy tín, chất xám và nguồn thu ổn định dài hạn.'}` }
          ]
        },
        {
          id: 'sec-4',
          num: '04',
          title: 'Cung Phụ Mẫu (Cha Mẹ, Gia Giáo & Mối Quan Hệ)',
          palaceRef: `Cung Phụ Mẫu tại ${phuMauP.chiName} · Nhị hợp ${getTamPhuongTuChinh(chart, phuMauP.chiIdx).nhiHop.name}`,
          items: [
            { label: 'Tính cách, học vấn & kinh tế cha mẹ', text: `Cung Phụ Mẫu có ${phuMauP.chinhTinh.length > 0 ? phuMauP.chinhTinh.map(s => `${s.name} (${s.brightness})`).join(', ') : 'thế Vô Chính Diệu mượn sao từ Tật Ách'}. Cha mẹ là người ${hasAny(getStars(phuMauP), ['Văn Xương', 'Văn Khúc', 'Hóa Khoa', 'Thiên Khôi', 'Thiên Việt', 'Thiên Phủ', 'Tử Vi']) ? 'có nền tảng tri thức, gia giáo nề nếp, kinh tế khá giả và coi trọng việc học hành của con cái.' : 'chịu thương chịu khó, tự lực vươn lên trong cuộc sống và truyền cho con tinh thần tự lập.'}` },
            { label: 'Cách cư xử & Quan hệ với đương số', text: `${hasAny(getStars(phuMauP), ['Kình Dương', 'Đà La', 'Hóa Kỵ', 'Thái Tuế', 'Thiên Hình', 'Cô Thần', 'Quả Tú']) ? 'Giữa cha mẹ và đương số đôi lúc có khoảng cách thế hệ hoặc bất đồng quan điểm sống; nên giữ thái độ mềm mỏng, lắng nghe để tăng sự thấu hiểu.' : 'Tình cảm gia đình ấm áp, cha mẹ là chỗ dựa tinh thần và định hướng quan trọng cho đương số.'}` }
          ]
        },
        {
          id: 'sec-5',
          num: '05',
          title: 'Cung Thiên Di (Xuất Hành, Đánh Giá Xã Hội & Thích Nghi)',
          palaceRef: `Cung Thiên Di tại ${diP.chiName} · Xung chiếu trực tiếp cung Mệnh (${menhP.chiName})`,
          items: [
            { label: 'Biểu hiện ra ngoài & Đánh giá xã hội', text: `Khi bước ra xã hội, đương số thể hiện khí chất của ${diP.chinhTinh.length > 0 ? diP.chinhTinh.map(s => `${s.name} (${s.brightness})`).join(', ') : 'bộ sao xung chiếu từ Mệnh'}. Mọi người bên ngoài nhìn nhận đương số là người ${hasAny(getStars(diP), ['Thái Dương', 'Tử Vi', 'Thiên Phủ', 'Thiên Lương', 'Hóa Khoa', 'Thiên Khôi', 'Thiên Việt']) ? 'đĩnh đạc, đáng tin cậy, có uy tín và dễ được quý nhân nâng đỡ.' : 'năng động, linh hoạt, có cá tính riêng và thích ứng nhanh với môi trường mới.'}` },
            { label: 'Khả năng giao tế, thử thách & Đào hoa ngoài xã hội', text: `${hasAny(getStars(diP), ['Thiên Mã', 'Tả Phù', 'Hữu Bật', 'Đào Hoa', 'Hồng Loan']) ? 'Có duyên ngoại giao, đi xa hoặc làm việc trong môi trường mở sẽ phát huy tối đa tài năng và thu hút nhiều nhân duyên tốt.' : 'Nên chủ động mở rộng mạng lưới kết nối thay vì thu mình.'} ${diP.hasTuan || diP.hasTriet || hasAny(getStars(diP), ['Địa Không', 'Địa Kiếp', 'Kình Dương', 'Đà La', 'Hóa Kỵ']) ? 'Thử thách khi ra ngoài là dễ gặp cạnh tranh ngầm hoặc thay đổi kế hoạch đột xuất, cần chuẩn bị kỹ phương án dự phòng.' : 'Môi trường bên ngoài tương đối thuận lợi cho việc lập thân.'}` }
          ]
        },
        {
          id: 'sec-6',
          num: '06',
          title: 'Cung Tật Ách (Sức Khỏe, Bệnh Lý Tiềm Ẩn & Dưỡng Sinh)',
          palaceRef: `Cung Tật Ách tại ${tatP.chiName} · Nhị hợp ${getTamPhuongTuChinh(chart, tatP.chiIdx).nhiHop.name}`,
          items: [
            { label: 'Các hệ cơ quan cần lưu ý', text: `Dựa trên tổ hợp sao tại Tật Ách (${getStars(tatP).slice(0, 6).join(', ')}), đương số cần chú ý chăm sóc: ${hasAny(getStars(tatP), ['Thiên Đồng', 'Thái Âm', 'Đại Hao', 'Tiểu Hao', 'Thiên Riêu']) ? 'hệ tiêu hóa, dạ dày và cân bằng nội tiết; ' : ''}${hasAny(getStars(tatP), ['Thái Dương', 'Thiên Cơ', 'Hỏa Tinh', 'Linh Tinh', 'Thiên Khốc', 'Thiên Hư']) ? 'hệ thần kinh, giấc ngủ, thị lực và áp lực căng thẳng tinh thần; ' : ''}${hasAny(getStars(tatP), ['Thất Sát', 'Kình Dương', 'Đà La', 'Bạch Hổ', 'Thiên Hình']) ? 'hệ hô hấp, xương khớp và tránh va chạm vật sắc nhọn khi đi lại.' : 'thể trạng tổng quát ở mức ổn định nếu duy trì vận động đều đặn.'}` },
            { label: 'Khả năng giải ách & Lời khuyên', text: `${tatP.hasTuan || tatP.hasTriet || hasAny(getStars(tatP), ['Thiên Giải', 'Địa Giải', 'Giải Thần', 'Ân Quang', 'Thiên Quý']) ? 'Cung Tật Ách có sao giải / Tuần Triệt trấn thủ nên khi gặp ốm đau thường gặp thầy gặp thuốc, tai qua nạn khỏi.' : 'Nên chủ động tầm soát sức khỏe định kỳ và rèn luyện thể thao để tăng sức đề kháng.'}` }
          ]
        },
        {
          id: 'sec-7',
          num: '07',
          title: 'Cung Nô Bộc (Bạn Bè, Cộng Sự & Quan Hệ Với Cấp Trên)',
          palaceRef: `Cung Nô Bộc tại ${noP.chiName} · Giáp ${getTamPhuongTuChinh(chart, noP.chiIdx).giapTruoc.name} & ${getTamPhuongTuChinh(chart, noP.chiIdx).giapSau.name}`,
          items: [
